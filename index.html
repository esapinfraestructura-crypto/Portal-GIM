<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal GIM — ESAP</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap');
:root{
  --navy:#0f1f3d;--navy2:#1a3057;--cyan:#0284c7;--cyan2:#0ea5e9;
  --green:#059669;--green-bg:#d1fae5;--amber:#d97706;--amber-bg:#fef3c7;
  --red:#dc2626;--red-bg:#fee2e2;--purple:#7c3aed;
  --slate:#475569;--border:#e2e8f0;--bg:#f0f4f9;--card:#ffffff;
  --ink:#0f172a;--muted:#64748b;--surface:#f8fafc;
  --sans:'Inter',system-ui,sans-serif;--mono:'IBM Plex Mono',monospace;
  --radius:10px;--radius-lg:14px;
  --shadow:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.05);
  --shadow-md:0 4px 16px rgba(0,0,0,.09);
  --shadow-lg:0 12px 40px rgba(0,0,0,.14);
  --transition:.18s cubic-bezier(.4,0,.2,1);
}
/* Login compat */
--cyan-bg:#dbeafe;
*{box-sizing:border-box;margin:0;padding:0;}
html{font-size:14px;}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
img{display:block;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

.login-over{
  position:fixed;inset:0;z-index:1000;
  background:linear-gradient(135deg,#060d1a 0%,#0a1628 40%,#0f2a4a 70%,#0a1e3a 100%);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font);
}
.login-over::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 70% 70% at 15% 70%,rgba(2,132,199,.15) 0%,transparent 60%),
    radial-gradient(ellipse 50% 50% at 85% 20%,rgba(124,58,237,.1) 0%,transparent 55%),
    radial-gradient(ellipse 40% 40% at 50% 50%,rgba(14,61,95,.25) 0%,transparent 70%);
}
.login-wrap{
  position:relative;z-index:1;
  display:flex;width:min(860px,96vw);min-height:520px;
  border-radius:24px;overflow:hidden;
  box-shadow:0 40px 100px rgba(0,0,0,.6);
  animation:slideUp .4s cubic-bezier(.22,1,.36,1);
}
@keyframes slideUp{from{opacity:0;transform:translateY(28px);}to{opacity:1;transform:translateY(0);}}

/* LEFT PANEL */
.login-left{
  flex:0 0 42%;background:linear-gradient(160deg,#0f1f3d 0%,#0c2e5a 60%,#0a3c70 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:48px 36px;gap:20px;position:relative;overflow:hidden;
}
.login-left::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 90% 60% at 50% 100%,rgba(2,132,199,.2) 0%,transparent 65%);
}
.login-left .ll-logo{
  width:100px;height:100px;border-radius:50%;
  border:3px solid rgba(255,255,255,.18);
  box-shadow:0 0 50px rgba(2,132,199,.4),0 0 0 8px rgba(2,132,199,.08);
  position:relative;z-index:1;
}
.login-left h1{font-size:24px;font-weight:900;color:#fff;text-align:center;margin:0;letter-spacing:-.02em;position:relative;z-index:1;}
.login-left .ll-org{font-size:12px;color:rgba(255,255,255,.45);text-align:center;line-height:1.6;position:relative;z-index:1;}
.login-left .ll-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(2,132,199,.2);border:1px solid rgba(2,132,199,.3);
  color:rgba(2,132,199,.9);border-radius:999px;padding:5px 14px;
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  position:relative;z-index:1;
}
.login-left .ll-dots{display:flex;gap:8px;position:relative;z-index:1;}
.login-left .ll-dots span{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2);}
.login-left .ll-dots span:nth-child(2){background:rgba(2,132,199,.6);}

/* RIGHT PANEL */
.login-right{
  flex:1;background:rgba(255,255,255,.03);backdrop-filter:blur(28px);
  border-left:1px solid rgba(255,255,255,.07);
  padding:48px 44px;display:flex;flex-direction:column;justify-content:center;
}
.login-right h2{font-size:20px;font-weight:800;color:#fff;margin:0 0 4px;}
.login-right .lr-sub{font-size:13px;color:rgba(255,255,255,.38);margin-bottom:32px;}
.login-box{background:transparent;border:none;border-radius:0;padding:0;width:100%;box-shadow:none;animation:none;}
.login-box .logos{display:none;}
.login-box h2{display:none;}
.login-box .sub{display:none;}

/* Mobile: stack */
@media(max-width:640px){
  .login-wrap{flex-direction:column;min-height:unset;}
  .login-left{padding:32px 24px;flex:none;}
  .login-left .ll-logo{width:72px;height:72px;}
  .login-left h1{font-size:19px;}
  .login-right{padding:32px 24px;}
}
.field{margin-bottom:18px;position:relative;}
.field label{display:block;font-weight:700;font-size:10.5px;margin-bottom:8px;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.08em;}
.field input,.field select,.field textarea{
  width:100%;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);
  color:#fff;border-radius:11px;padding:13px 16px;font-size:14.5px;
  transition:border-color .2s,background .2s,box-shadow .2s;
  font-family:var(--font);box-sizing:border-box;
}
.field input::placeholder{color:rgba(255,255,255,.2);}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:rgba(2,132,199,.55);
  background:rgba(255,255,255,.09);
  box-shadow:0 0 0 3px rgba(2,132,199,.12);
}
.field select option{background:#0f1f3d;color:#fff;}
.field textarea{resize:vertical;min-height:70px;}
.field .eye-btn{
  position:absolute;right:14px;bottom:13px;
  background:none;border:none;cursor:pointer;
  color:rgba(255,255,255,.35);font-size:16px;line-height:1;padding:0;
  transition:color .15s;
}
.field .eye-btn:hover{color:rgba(255,255,255,.7);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

.modal-body{padding:22px 24px;overflow-y:auto;flex:1;}
.modal-head{padding:18px 24px;border-bottom:1px solid var(--border);}
.modal-head h3{font-size:17px;font-weight:900;color:#0f1f3d;}
.modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px;}
.mf{margin-bottom:18px;}
.mf>span{display:block;font-size:11px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.07em;margin-bottom:7px;}
.mf input,.mf select,.mf textarea{
  display:block;width:100%;padding:10px 13px;
  border:1.5px solid #e2e8f0;border-radius:9px;
  font-size:14px;color:#0f172a;background:#f8fafc;
  font-family:inherit;box-sizing:border-box;
}
.mf textarea{min-height:80px;resize:vertical;}
.mf select option{background:#fff;color:#0f172a;}
.err-box{background:rgba(220,38,38,.15);border:1px solid rgba(220,38,38,.25);color:#fca5a5;border-radius:8px;padding:10px 12px;font-size:12.5px;margin-bottom:14px;}

.topbar{
  background:linear-gradient(90deg,var(--navy) 0%,var(--navy2) 100%);
  color:#fff;padding:0 24px;height:62px;
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:40;
  box-shadow:0 2px 12px rgba(0,0,0,.25);
}
.brand{display:flex;align-items:center;gap:12px;}
.brand .ant{width:38px;height:38px;border-radius:10px;object-fit:cover;}
.brand-text .name{font-weight:800;font-size:16px;letter-spacing:-.01em;}
.brand-text .sub{font-size:10px;color:rgba(255,255,255,.4);font-family:var(--mono);margin-top:2px;}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;}

.nav-bar{background:var(--card);border-bottom:1px solid var(--border);padding:0 24px;display:flex;gap:0;overflow-x:auto;box-shadow:var(--shadow);}
.nav-tab{padding:15px 18px;font-weight:700;font-size:13px;color:var(--muted);background:none;border:none;border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap;transition:color var(--transition),border-color var(--transition);}
.nav-tab:hover{color:var(--ink);}
.nav-tab.active{color:var(--navy);border-bottom-color:var(--cyan);}

.main{max-width:1320px;margin:0 auto;padding:28px 24px 64px;}
.section-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.section-lbl::after{content:'';flex:1;height:1px;background:var(--border);}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow);}
.card-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.card-head h4{font-size:14px;font-weight:700;color:var(--ink);}
.card-body{padding:20px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
@media(max-width:800px){.grid-2,.grid-3,.form-row{grid-template-columns:1fr;}}

.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;border:1px solid var(--border);background:var(--card);padding:8px 16px;font-size:13px;font-weight:600;color:var(--ink);transition:all var(--transition);cursor:pointer;}
.btn:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
.btn-primary{background:var(--cyan);border-color:var(--cyan);color:#fff;box-shadow:0 2px 8px rgba(2,132,199,.3);}
.btn-primary:hover{background:var(--cyan2);box-shadow:0 4px 16px rgba(2,132,199,.4);}
.btn-ghost{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.8);border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:600;transition:all var(--transition);}
.btn-ghost:hover{background:rgba(255,255,255,.12);color:#fff;}
.btn-danger{color:var(--red);border-color:rgba(220,38,38,.3);}
.btn-danger:hover{background:var(--red);color:#fff;}
.btn-sm{padding:5px 10px;font-size:12px;}

.tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;}
.tool-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:0;text-decoration:none;color:inherit;display:flex;flex-direction:column;
  transition:all var(--transition);position:relative;overflow:hidden;box-shadow:var(--shadow);
}
.tool-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--cyan),var(--cyan2));}
.tool-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-3px);}
.tool-card.disabled{opacity:.6;}
.tc-body{padding:20px 20px 14px;}
.tc-icon{font-size:28px;margin-bottom:12px;display:block;}
.tc-name{font-weight:800;font-size:15px;color:var(--ink);margin-bottom:6px;}
.tc-desc{font-size:12.5px;color:var(--muted);line-height:1.5;}
.tc-footer{padding:12px 20px;border-top:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:space-between;margin-top:auto;}
.tc-badge{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:999px;align-self:flex-start;}
.tc-activo{background:#d1fae5;color:#065f46;}
.tc-construccion{background:#fef3c7;color:#92400e;}
.tc-accion{font-size:12px;font-weight:700;color:var(--cyan);display:flex;align-items:center;gap:4px;}
.tc-admin{position:absolute;top:14px;right:14px;display:flex;gap:4px;z-index:1;}

.org-wrap{padding:8px 0 24px;}
.org-coord{display:flex;justify-content:center;margin-bottom:36px;}
.person-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;text-align:center;position:relative;box-shadow:var(--shadow);transition:box-shadow var(--transition);}
.person-card:hover{box-shadow:var(--shadow-md);}
.person-card .p-foto{width:76px;height:76px;border-radius:50%;object-fit:cover;margin:0 auto 12px;border:3px solid var(--border);}
.person-card .p-foto-ph{width:76px;height:76px;border-radius:50%;background:var(--surface);border:3px solid var(--border);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--muted);}
/* New professional card styles */
.p-card-pro{background:var(--card);border-radius:16px;border:1px solid var(--border);padding:0;position:relative;overflow:hidden;transition:box-shadow .25s,transform .2s;box-shadow:0 2px 12px rgba(0,0,0,.08);}
.p-card-pro:hover{box-shadow:0 10px 32px rgba(0,0,0,.16);transform:translateY(-3px);}
.p-card-pro .p-banner{height:5px;width:100%;}
.p-card-pro .p-body{padding:14px 16px 16px;}
.p-card-pro .p-avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2.5px solid var(--card);box-shadow:0 2px 10px rgba(0,0,0,.18);flex-shrink:0;}
.p-card-pro .p-avatar-ph{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#fff;border:2.5px solid var(--card);box-shadow:0 2px 10px rgba(0,0,0,.18);flex-shrink:0;}
.p-card-pro .p-name{font-weight:800;font-size:13px;color:var(--ink);line-height:1.35;margin-bottom:3px;}
.p-card-pro .p-role{font-size:11px;font-weight:600;line-height:1.35;opacity:.85;}
.p-card-pro .p-desc-text{font-size:11.5px;color:var(--muted);line-height:1.65;margin-top:11px;padding-top:11px;border-top:1px solid var(--border);}
.p-admin-btns{display:none;position:absolute;top:8px;right:8px;gap:3px;flex-direction:column;z-index:5;}
.p-admin-btns .btn{background:rgba(15,31,61,.85);color:#fff;border-color:transparent;backdrop-filter:blur(4px);}
.person-card .p-name{font-weight:700;font-size:13.5px;color:var(--ink);}
.person-card .p-cargo{font-size:11.5px;color:var(--cyan);font-weight:600;margin-top:3px;}
.person-card .p-desc{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.45;}
.person-card .p-equipo{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;margin-top:6px;display:inline-block;}
.org-connector{text-align:center;color:var(--border);font-size:18px;margin:8px 0;}
.org-planta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:28px;}
.org-equipo{margin-bottom:22px;}
.org-equipo-title{font-weight:700;font-size:13px;padding:6px 14px;border-radius:8px;margin-bottom:12px;display:inline-block;}
.org-equipo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;}
.person-card.coord{max-width:300px;border-top:3px solid var(--navy);}
.person-card.planta{border-top:3px solid var(--cyan);}
.person-card .p-admin-btns{display:none;position:absolute;top:8px;right:8px;gap:3px;flex-direction:column;}
.admin-mode .person-card:hover .p-admin-btns{display:flex;}

.user-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.user-row:last-child{border-bottom:none;}
.user-avatar{width:38px;height:38px;border-radius:10px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:var(--cyan);flex-shrink:0;}
.user-info{flex:1;min-width:0;}
.user-name{font-weight:700;font-size:13.5px;}
.user-meta{font-size:11.5px;color:var(--muted);font-family:var(--mono);}
.rol-badge{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:999px;}
.rb-admin{background:#ede9fe;color:#6d28d9;}
.rb-tecnico{background:#dbeafe;color:#1d4ed8;}
.rb-juridico{background:#f3e8ff;color:var(--purple);}
.rb-financiero{background:#d1fae5;color:#065f46;}
.rb-lectura{background:var(--surface);color:var(--muted);}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px;margin-bottom:20px;}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;border-top:3px solid var(--kc,var(--cyan));box-shadow:var(--shadow);transition:all var(--transition);}
.kpi:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
.kpi .n{font-family:var(--mono);font-size:28px;font-weight:800;color:var(--kc,var(--cyan));line-height:1;}
.kpi .l{font-size:12px;color:var(--muted);margin-top:4px;font-weight:600;}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:500;}
.overlay.show{display:flex;}
.modal{background:var(--card);border-radius:var(--radius-lg);max-width:560px;width:100%;box-shadow:var(--shadow-lg);animation:slideUp .2s ease;}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{font-size:16px;font-weight:800;}
.modal-close{border:none;background:none;font-size:18px;color:var(--muted);cursor:pointer;width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;}
.modal-close:hover{background:var(--surface);}
.modal-body{padding:20px 22px;max-height:66vh;overflow-y:auto;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}

#toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transform:translateY(8px);transition:.2s;z-index:9999;box-shadow:var(--shadow-lg);}
#toast.show{opacity:1;transform:translateY(0);}
.empty{text-align:center;padding:44px 20px;color:var(--muted);}

/* Portal banner */
.portal-banner{
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 60%,#0e3d5f 100%);
  border-radius:var(--radius-lg);padding:28px 32px;margin-bottom:24px;
  color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow-lg);
}
.portal-banner::after{content:'';position:absolute;right:-20px;top:-20px;width:180px;height:180px;border-radius:50%;background:rgba(2,132,199,.12);}
.banner-title{font-size:22px;font-weight:900;letter-spacing:-.02em;margin-bottom:4px;position:relative;z-index:1;}
.banner-sub{font-size:13px;color:rgba(255,255,255,.5);position:relative;z-index:1;}
.banner-meta{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;position:relative;z-index:1;}
.banner-chip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;}

/* btn-icon */
.btn-icon{background:none;border:none;padding:4px 8px;cursor:pointer;color:var(--muted);font-size:14px;}
.btn-icon:hover{color:var(--ink);}
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>

<div class="login-over" id="loginOver">
  <div class="login-wrap">

/* ═══ Utils ═══ */
function esc(s){ if(!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function uid(){ return 'u'+Math.random().toString(36).slice(2,9); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(window._tt); window._tt=setTimeout(()=>t.classList.remove('show'),2600); }
function loGet(k){ return localStorage.getItem('portal_gim_'+k)||''; }
function loSet(k,v){ try{ localStorage.setItem('portal_gim_'+k,v); }catch(e){} }

/* ═══ Persistencia ═══ */
async function remoteLoad(tool){
  if(!ST.scriptUrl) throw new Error('sin url');
  const res=await fetch(ST.scriptUrl+'?tool='+tool,{redirect:'follow'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  return await res.json();
}
async function remoteSave(tool, data){
  if(!ST.scriptUrl) return;
  try{ await fetch(ST.scriptUrl+'?tool='+tool,{method:'POST',mode:'no-cors',body:JSON.stringify(data)}); }catch(e){}
}

async function loadPortalData(){
  ST.scriptUrl = loGet('script_url');
  try{ ST.pwdOverrides=JSON.parse(loGet('pwd_overrides')||'{}'); }catch(e){}

  // Load from localStorage first (always reliable)
  const localCache=loGet('portal_cache');
  if(localCache){
    try{
      const d=JSON.parse(localCache);
      ST.usuarios=d.usuarios&&d.usuarios.length>0?d.usuarios:[...DEFAULT_USUARIOS];
      ST.tools=d.tools||[];
      ST.orgData=d.organigrama||null;
    }catch(e){ ST.usuarios=[...DEFAULT_USUARIOS]; }
  } else {
    ST.usuarios=[...DEFAULT_USUARIOS];
  }
  // Restore orgData from backup key if main cache doesn't have it
  if(!ST.orgData){
    try{ const org2=loGet('portal_org_v2');if(org2)ST.orgData=JSON.parse(org2); }catch(e){}
  }

  // Si hay Drive, cargar en segundo plano sin pisar el organigrama local
  if(ST.scriptUrl){
    try{
      const d=await remoteLoad('portal');
      // Solo actualizar usuarios y tools desde Drive (no organigrama — localStorage manda)
      if(d.usuarios&&d.usuarios.length>0) ST.usuarios=d.usuarios;
      if(d.tools&&d.tools.length>0) ST.tools=d.tools;
      // Organigrama: usar Drive solo si localStorage está vacío
      if(!ST.orgData&&d.organigrama) ST.orgData=d.organigrama;
      // Sincronizar: subir a Drive si Drive no tiene datos
      if(!d.usuarios||d.usuarios.length===0) savePortalData();
    }catch(e){ /* Drive falló, ya tenemos localStorage */ }
  }
}

async function savePortalData(){
  const payload={usuarios:ST.usuarios, tools:ST.tools, organigrama:ST.orgData};
  // Always save to localStorage first - guaranteed to work
  try{ loSet('portal_cache',JSON.stringify(payload)); }catch(e){ console.error('Cache save error',e); }
  // Also save orgData separately for extra reliability
  try{ if(ST.orgData) loSet('portal_org_v2',JSON.stringify(ST.orgData)); }catch(e){}
  // Drive in background
  if(ST.scriptUrl){ remoteSave('portal',payload).catch(()=>{}); }
  return Promise.resolve();
}

/* ═══ Login ═══ */
function buscarUsuario(usuario, contrasena){
  const userLower = usuario.toLowerCase().trim();
  // Super admin — contraseña directa, siempre funciona
  if(userLower === SUPER_ADMIN.usuario){
    const enLista = ST.usuarios.find(x => x.usuario === SUPER_ADMIN.usuario);
    const pwd = (enLista && enLista.contrasena) ? enLista.contrasena : SUPER_ADMIN.contrasena;
    if(contrasena === pwd) return {...SUPER_ADMIN};
    // Fallback: si por alguna razón el override no funciona, intenta con la cédula original
    if(contrasena === SUPER_ADMIN.contrasena) return {...SUPER_ADMIN};
  }
  // Resto de usuarios
  const entry = ST.usuarios.find(x => x.usuario.toLowerCase() === userLower);
  if(!entry) return null;
  if(entry.activo === false) return null;
  if(entry.contrasena === contrasena) return entry;
  return null;
}

async function init(){
  try{ await loadPortalData(); }catch(e){ ST.usuarios=[...DEFAULT_USUARIOS]; }
  if(!ST.usuarios || ST.usuarios.length===0) ST.usuarios=[...DEFAULT_USUARIOS];
  const saved=loGet('session');
  if(saved){ try{ const s=JSON.parse(saved); if(s&&s.user){ SES=s; showApp(); return; } }catch(e){} }
  showLogin();
}

function showLogin(){ document.getElementById('loginOver').style.display='flex'; document.getElementById('appRoot').style.display='none'; }
function showApp(){
  document.getElementById('loginOver').style.display='none';
  document.getElementById('appRoot').style.display='block';
  if(SES.rol==='admin') document.getElementById('tabAdmin').style.display='';
  document.getElementById('tUser').textContent='👤 '+SES.nombre+' ('+SES.user+')';
  updateDriveStatus();
  setView('herramientas');
  attachTopEvents();
}

document.getElementById('lBtn').addEventListener('click', doLogin);
document.getElementById('lPass').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
document.getElementById('eyeBtn')?.addEventListener('click',function(){
  const inp=document.getElementById('lPass');
  if(inp.type==='password'){inp.type='text';this.textContent='🙈';}
  else{inp.type='password';this.textContent='👁';}
});
async function doLogin(){
  const u=document.getElementById('lUser').value.trim();
  const p=document.getElementById('lPass').value;
  const errEl=document.getElementById('loginErr');
  if(!u||!p){ errEl.textContent='Completa usuario y contraseña.'; errEl.style.display='block'; return; }
  const entry=buscarUsuario(u,p);
  if(!entry){ errEl.textContent='Usuario o contraseña incorrectos.'; errEl.style.display='block'; return; }
  SES={user:entry.usuario, rol:entry.rol, nombre:entry.nombre||entry.usuario};
  loSet('session',JSON.stringify(SES));
  errEl.style.display='none';
  showApp();
}

function doLogout(){
  SES={user:null,rol:null,nombre:''};
  loSet('session','');
  showLogin();
}

function updateDriveStatus(){
  const s=document.getElementById('tStatus');
  if(ST.scriptUrl){ s.textContent='🟢 Drive'; s.style.cssText='background:#d1fae5;color:#065f46;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;'; }
  else { s.textContent='🟡 Local'; s.style.cssText='background:#fef3cd;color:#92400e;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;'; }
}

function attachTopEvents(){
  document.getElementById('btnOut').onclick=doLogout;
  document.getElementById('btnPwd').onclick=modalPwd;
  document.getElementById('btnDrive').onclick=modalDrive;
  document.querySelectorAll('.nav-tab').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.tab)));
}

/* ═══ View router ═══ */
function setView(v){
  ST.view=v;
  document.querySelectorAll('.nav-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===v));
  const mc=document.getElementById('mainContent');
  if(v==='herramientas') renderHerramientas(mc);
  else if(v==='organigrama') renderOrganigrama(mc);
  else if(v==='admin' && SES.rol==='admin') renderAdmin(mc);
}

    ...TOOLS_FIXED.map(t=> overrides[t.id] ? {...t,...overrides[t.id], fijo:true} : t),
    ...ST.tools.filter(t=>!TOOLS_FIXED.find(f=>f.id===t.id))
  ];
}

async function modalEditTool(toolId){
  const current = toolId ? allTools().find(t=>t.id===toolId) : null;
  const isFixed = current?.fijo && !ST.tools.find(t=>t.id===toolId);
  const isNew = !toolId;
  const enConstruccion = current?.estado !== 'activo';
  const REPO_URL = 'https://github.com/esapinfraestructura-crypto/Portal-GIM';

  const inp=(id,val,ph,xst)=>'<input id="'+id+'" value="'+esc(val||'')+'" placeholder="'+(ph||'')+'" '+(xst?'style="'+xst+'"':'')+' >';
  const ta=(id,val)=>'<textarea id="'+id+'">'+esc(val||'')+'</textarea>';
  const lbl=(t,c)=>'<div class="mf"><span>'+t+'</span>'+c+'</div>';

  let _tHtml='<div class="modal-head">'
    +'<h3>'+(isNew?'Nueva herramienta':enConstruccion?'Activar: '+esc(current?.nombre||''):'Editar: '+esc(current?.nombre||''))+'</h3>'
    +'<button class="modal-close" onclick="closeModal()">✕</button></div>'
    +'<div class="modal-body">';

  if(!isNew&&enConstruccion){
    _tHtml+='<div style="background:#f0fdf4;border:1px solid #86efac;border-radius:10px;padding:14px 16px;margin-bottom:18px;font-size:13px;">'
      +'<div style="font-weight:700;color:#15803d;margin-bottom:8px;">Pasos para activar</div>'
      +'<div style="color:#166534;line-height:1.8;">1. Descarga el archivo HTML y sübelo al repositorio GitHub<br>'
      +'2. <a href="'+REPO_URL+'/upload/main" target="_blank" style="color:#15803d;font-weight:700;">Clic aquí para abrir GitHub y subir</a><br>'
      +'3. Confirma el nombre del archivo abajo y cambia el estado a Activo</div></div>';
  }

  _tHtml+=lbl('Nombre de la herramienta', inp('tNom', current?.nombre, 'Ej: Seguimiento de contratos'));
  _tHtml+='<div style="display:grid;grid-template-columns:90px 1fr;gap:14px;">'
    +lbl('Ícono', inp('tIco', current?.icono||'🔧','','font-size:24px;text-align:center;width:100%;'))
    +lbl('Categoría', inp('tCat', current?.categoria||'Gestión'))
    +'</div>';
  _tHtml+=lbl('Descripción', ta('tDesc', current?.desc));
  _tHtml+='<div class="mf"><span>Archivo en GitHub (.html)</span>'
    +inp('tUrl', current?.url, 'nombre-herramienta.html', 'font-family:monospace;')
    +'<div style="font-size:11px;color:#64748b;margin-top:6px;">Debe coincidir exactamente con el archivo en el repositorio.'
    +(current?.url?' &nbsp;<a href="https://esapinfraestructura-crypto.github.io/Portal-GIM/'+esc(current?.url)+'" target="_blank" style="color:#0284c7;">Ver en vivo</a>':'')
    +'</div></div>';
  _tHtml+='<div class="mf"><span>Estado de la herramienta</span>'
    +'<select id="tEst">'
    +'<option value="activo" '+(current?.estado==='activo'?'selected':'')+'>✅ Activo — funciona y está visible</option>'
    +'<option value="construccion" '+(current?.estado==='construccion'||!current?'selected':'')+'>🔨 En construcción — en desarrollo</option>'
    +'<option value="proximamente" '+(current?.estado==='proximamente'?'selected':'')+'>🕐 Próximamente — planeada</option>'
    +'</select></div>';
  _tHtml+='</div><div class="modal-foot" style="padding:20px 28px;">'
    +(toolId&&!current?.fijo?'<button class="btn btn-danger btn-sm" id="tDel">Eliminar</button>':'<span></span>')
    +'<div style="display:flex;gap:8px;">'
    +'<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>'
    +'<button class="btn btn-primary" id="tSave">'+(enConstruccion&&!isNew?'Activar herramienta':'Guardar cambios')+'</button>'
    +'</div></div>';
  document.getElementById('modal').innerHTML=_tHtml;
  openModal();
  if(document.getElementById('tDel')) document.getElementById('tDel').addEventListener('click',()=>{ if(confirm('¿Eliminar esta herramienta?')){eliminarTool(toolId);closeModal();} });
  document.getElementById('tSave').addEventListener('click',async()=>{
    const estado=document.getElementById('tEst').value;
    const url=document.getElementById('tUrl').value.trim();
    const nombre=document.getElementById('tNom')?.value?.trim()||current?.nombre||'';
    if(!nombre){ toast('El nombre es obligatorio'); return; }
    const entry={
      id:toolId||uid(),
      nombre,
      icono:document.getElementById('tIco')?.value||current?.icono||'🔧',
      desc:document.getElementById('tDesc')?.value?.trim()||current?.desc||'',
      url,
      categoria:document.getElementById('tCat')?.value?.trim()||current?.categoria||'Gestión',
      estado,
      fijo:current?.fijo||false
    };
    const idx=ST.tools.findIndex(t=>t.id===entry.id);
    if(idx>=0) ST.tools[idx]=entry; else ST.tools.push(entry);
    await savePortalData(); closeModal(); setView('herramientas');
    toast(estado==='activo'?'✅ ¡Herramienta activada y visible para el equipo!':'Estado guardado ✓');
  });
}
async function eliminarTool(id){ if(!confirm('¿Eliminar esta herramienta?')) return; ST.tools=ST.tools.filter(t=>t.id!==id); await savePortalData(); setView('herramientas'); toast('Eliminado'); }

function getFase(p){ try{ const proc=p.procesos?.[0]; if(!proc) return 'precontractual'; if(!proc.precontractual?.evalPonderable?.numeroContrato) return 'precontractual'; if(proc.poscontractual?.recibo?.estado!=='Recibido a satisfacción') return 'contractual'; if(!proc.poscontractual?.liquidacion?.fecha) return 'poscontractual'; return 'finalizado'; }catch(e){ return 'precontractual'; } }
function getAv(p){ const f=getFase(p); if(f==='finalizado') return 100; if(f==='contractual') return 55; if(f==='poscontractual') return 90; return 0; }
function fmtD(iso){ if(!iso) return '—'; try{ const d=new Date(iso); return d.toLocaleDateString('es-CO',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return iso; } }

function getOrg(){
  if(!ST.orgData){
    ST.orgData = structuredClone(ORG_DEFAULT);
  }
  const org = ST.orgData;
  // Migrar estructura antigua: si asesores no existe como campo separado
  // pero existe como equipo, moverlo al nivel correcto
  if(!org.asesores || org.asesores.length===0){
    const asesorEquipo = (org.equipos||[]).find(e=>e.nombre==='Asesores');
    if(asesorEquipo){
      org.asesores = asesorEquipo.personas || [];
      org.equipos = (org.equipos||[]).filter(e=>e.nombre!=='Asesores');
    } else {
      org.asesores = org.asesores || [];
    }
  }
  if(!org.asistencia) org.asistencia = [];
  if(!org.paa) org.paa = structuredClone(ORG_DEFAULT.paa||[]);
  if(!org.asesores) org.asesores = structuredClone(ORG_DEFAULT.asesores||[]);
  if(!org.planta) org.planta = structuredClone(ORG_DEFAULT.planta||[]);
  if(!org.equipos) org.equipos = structuredClone(ORG_DEFAULT.equipos);
  // Ensure all personas have usuario field for lookup
  const ensureUsuario = (arr) => (arr||[]).forEach((p,i)=>{ if(!p.usuario) p.usuario = 'p_'+i+'_'+Date.now(); });
  ensureUsuario(org.planta); ensureUsuario(org.asistencia); ensureUsuario(org.asesores);
  ensureUsuario(org.paa); (org.equipos||[]).forEach(e=>ensureUsuario(e.personas));
  return org;
}

function personCard(p, tipo, borderColor, idx, total, equipoIdx){
  // Generate colored initials avatar
  const initials=(p.nombre||'?').split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
  const foto=p.foto
    ?'<img class="p-avatar" src="'+p.foto+'" alt="'+esc(p.nombre)+'">'
    :'<div class="p-avatar-ph" style="background:'+(borderColor||'#0f1f3d')+';">'+initials+'</div>';
  const ref=encodeURIComponent(JSON.stringify({tipo:tipo, idx:idx, equipoIdx:equipoIdx!==undefined?equipoIdx:-1, usuario:p.usuario||''}));
  let adminBtns='';
  if(SES.rol==='admin'){
    const safeRef=ref.replace(/'/g,'&apos;');
    adminBtns='<div style="display:none;position:absolute;top:6px;right:6px;gap:3px;flex-direction:column;" class="p-admin-btns">'
      +(idx>0?'<button class="btn btn-sm" style="padding:2px 6px;font-size:11px;" onclick="event.stopPropagation();moverPersonaRef(this,-1)" data-ref="'+safeRef+'">↑</button>':'<span style="height:24px;display:block;"></span>')
      +((total!==undefined&&idx<total-1)?'<button class="btn btn-sm" style="padding:2px 6px;font-size:11px;" onclick="event.stopPropagation();moverPersonaRef(this,1)" data-ref="'+safeRef+'">↓</button>':'<span style="height:24px;display:block;"></span>')
      +'<button class="btn btn-sm" style="padding:2px 6px;font-size:11px;" onclick="event.stopPropagation();editPersonaRef(this)" data-ref="'+safeRef+'">✏️</button>'
      +(tipo!=='coord'?'<button class="btn btn-sm btn-danger" style="padding:2px 6px;font-size:11px;" onclick="event.stopPropagation();eliminarPersonaRef(this)" data-ref="'+safeRef+'">🗑️</button>':'')
      +'</div>';
  }
  return '<div class="p-card-pro"'
    +' onmouseenter="var b=this.querySelector(\'.p-admin-btns\');if(b)b.style.display=\'flex\';"'
    +' onmouseleave="var b=this.querySelector(\'.p-admin-btns\');if(b)b.style.display=\'none\';">'
    +'<div class="p-banner" style="background:'+(borderColor||'#0f1f3d')+';"></div>'
    +adminBtns
    +'<div class="p-body">'
      +'<div style="display:flex;align-items:center;gap:12px;margin-bottom:'+(p.descripcion?'0':'0')+'px;">'
        +foto
        +'<div style="min-width:0;flex:1;">'
          +'<div class="p-name">'+esc(p.nombre)+'</div>'
          +'<div class="p-role" style="color:'+(borderColor||'#0f1f3d')+';">'+esc(p.cargo||'')+'</div>'
        +'</div>'
      +'</div>'
      +(p.descripcion?'<div class="p-desc-text">'+esc(p.descripcion)+'</div>':'')
    +'</div>'
    +'</div>';
}

function moverPersona(encoded, dir){
  let ref;
  try{ ref=JSON.parse(decodeURIComponent(encoded)); }catch(e){ return; }
  const org=getOrg();
  const i=Number(ref.idx);
  let arr=null;
  if(ref.tipo==='planta')       arr=org.planta;
  else if(ref.tipo==='paa')     arr=org.paa;
  else if(ref.tipo==='asistencia') arr=org.asistencia;
  else if(ref.tipo==='asesores')   arr=org.asesores;
  else if(ref.tipo==='paa'){ arr=org.paa; }
  else if(ref.tipo==='contratista'){
    const eq=(org.equipos||[])[Number(ref.equipoIdx)];
    if(eq) arr=eq.personas;
  }
  if(!arr||arr.length<2) return;
  const j=i+dir;
  if(j<0||j>=arr.length) return;
  const tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp;
  ST.orgData=org;
  setView('organigrama');
  toast(dir<0?'↑ Persona movida hacia arriba':'↓ Persona movida hacia abajo');
  savePortalData();
}

function findPersona(org, ref){
  const usuario=ref.usuario||'';
  const idx=parseInt(ref.idx)||0;
  const eqIdx=parseInt(ref.equipoIdx)||-1;
  const find=(arr)=>{
    if(!arr)return null;
    if(usuario){const f=arr.find(p=>p.usuario===usuario);if(f)return f;}
    return arr[idx]||null;
  };
  if(ref.tipo==='coord')return org.coordinador;
  if(ref.tipo==='planta')return find(org.planta);
  if(ref.tipo==='asistencia')return find(org.asistencia);
  if(ref.tipo==='asesores')return find(org.asesores);
  if(ref.tipo==='paa')return find(org.paa);
  if(ref.tipo==='contratista'){
    const eq=(org.equipos||[])[eqIdx>=0?eqIdx:0];
    return eq?find(eq.personas):null;
  }
  return null;
}

function eliminarPersona(encoded){
  let ref; try{ ref=JSON.parse(decodeURIComponent(encoded)); }catch(e){ return; }
  const org=getOrg();
  const persona=findPersona(org,ref);
  if(ref.tipo==='coord'){ toast('El coordinador no puede eliminarse'); return; }
  const nombre=persona?.nombre||'esta persona';
  if(!confirm('¿Quitar a '+nombre+' del organigrama?')) return;
  const spliceByUsuario=(arr)=>{
    if(!arr)return;
    const u=ref.usuario||'';
    const idx=u?arr.findIndex(p=>p.usuario===u):parseInt(ref.idx)||0;
    if(idx>=0)arr.splice(idx,1);
  };
  const eqIdx=parseInt(ref.equipoIdx)||-1;
  if(ref.tipo==='planta')spliceByUsuario(org.planta);
  else if(ref.tipo==='asistencia')spliceByUsuario(org.asistencia);
  else if(ref.tipo==='asesores')spliceByUsuario(org.asesores);
  else if(ref.tipo==='paa')spliceByUsuario(org.paa);
  else if(ref.tipo==='contratista'){const eq=(org.equipos||[])[eqIdx>=0?eqIdx:0];if(eq)spliceByUsuario(eq.personas);}
  ST.orgData=org;
  savePortalData().then(()=>{ setView('organigrama'); toast('✅ '+nombre+' eliminado del organigrama'); });
}

    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">'
      +'<div class="mf"><span>Número de cédula</span><input id="uCed" value="'+esc(u?u.cedula:'')+'" style="'+fStyle+'" placeholder="Número de cédula"></div>'
      +'<div class="mf"><span>Contraseña</span><input id="uPass" type="text" value="'+esc(u?u.contrasena:(u?u.cedula:''))+'" style="'+fStyle+'" placeholder="Dejar vacío = usar cédula"></div>'
    +'</div>'

    // Rol
    +'<div class="mf"><span>Rol y nivel de acceso</span><select id="uRol" style="'+fStyle+'display:block;">'+rolesOpts+'</select></div>'

    // Rol description box
    +'<div id="uRolDesc" style="background:#f0f9ff;border:1px solid #bae6fd;border-radius:9px;padding:10px 14px;font-size:12.5px;color:#0369a1;margin-top:-8px;margin-bottom:16px;line-height:1.6;"></div>'

    // Acceso activo
    +'<div style="display:flex;align-items:center;gap:12px;background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:10px;padding:12px 16px;margin-bottom:4px;">'
      +'<label style="position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0;">'
        +'<input type="checkbox" id="uActivo" '+(isActive?'checked':'')+' style="opacity:0;width:0;height:0;">'
        +'<span id="uActivoSlider" style="position:absolute;cursor:pointer;inset:0;background:'+(isActive?'#059669':'#94a3b8')+';border-radius:24px;transition:.2s;"></span>'
        +'<span id="uActivoKnob" style="position:absolute;height:18px;width:18px;left:'+(isActive?'23px':'3px')+';bottom:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.25);"></span>'
      +'</label>'
      +'<div>'
        +'<div style="font-size:13px;font-weight:700;color:#0f172a;">Acceso al portal</div>'
        +'<div id="uActivoLabel" style="font-size:11.5px;color:#64748b;">'+(isActive?'El usuario puede iniciar sesión':'Acceso desactivado — no puede ingresar')+'</div>'
      +'</div>'
    +'</div>'

    +'</div>'
    +'<div class="modal-foot">'
      +'<div style="display:flex;gap:8px;">'
        +(!isNew&&u&&u.usuario!==SUPER_ADMIN.usuario?'<button class="btn btn-sm" style="color:#dc2626;border-color:#dc2626;" onclick="eliminarUsuario(\''+esc(u.usuario)+'\')">🗑 Eliminar</button>':'')
      +'</div>'
      +'<div style="display:flex;gap:8px;">'
        +'<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>'
        +'<button class="btn btn-primary" id="uSave">💾 Guardar cambios</button>'
      +'</div>'
    +'</div>';

  openModal();

  // Rol description helper
  const rolDescs={
    admin:'Acceso total: puede ver y editar todo el portal, gestionar usuarios, organigrama y herramientas.',
    tecnico:'Acceso técnico: puede ver y editar proyectos, herramientas del equipo técnico GIM.',
    juridico:'Acceso jurídico: puede ver y editar documentos y trámites del equipo jurídico.',
    financiero:'Acceso financiero: puede ver y editar información presupuestal y financiera.',
    lectura:'Solo lectura: puede ver el portal pero no puede crear ni modificar nada.'
  };
  const updateRolDesc=function(){
    const sel=document.getElementById('uRol');
    const desc=document.getElementById('uRolDesc');
    if(sel&&desc) desc.textContent=rolDescs[sel.value]||'';
  };
  document.getElementById('uRol')?.addEventListener('change', updateRolDesc);
  updateRolDesc();

  // Toggle activo
  document.getElementById('uActivo')?.addEventListener('change',function(){
    const s=document.getElementById('uActivoSlider');
    const k=document.getElementById('uActivoKnob');
    const l=document.getElementById('uActivoLabel');
    if(this.checked){
      s.style.background='#059669'; k.style.left='23px';
      l.textContent='El usuario puede iniciar sesión';
    } else {
      s.style.background='#94a3b8'; k.style.left='3px';
      l.textContent='Acceso desactivado — no puede ingresar';
    }
  });

  // Save
  document.getElementById('uSave')?.addEventListener('click',async function(){
    const nombre=(document.getElementById('uNom')?.value||'').trim();
    const cedula=(document.getElementById('uCed')?.value||'').trim();
    const usuarioVal=isNew?(document.getElementById('uUser')?.value||'').trim().toLowerCase():usuarioKey;
    const contrasena=(document.getElementById('uPass')?.value||'').trim()||cedula;
    const rol=document.getElementById('uRol')?.value||'lectura';
    const activo=document.getElementById('uActivo')?.checked!==false;
    if(!nombre||!usuarioVal){ toast('Nombre y usuario son obligatorios'); return; }
    if(usuarioVal===SUPER_ADMIN.usuario){ toast('El admin maestro no se puede editar desde aquí'); return; }
    if(isNew&&ST.usuarios.find(function(x){return x.usuario===usuarioVal;})){ toast('Ese usuario ya existe'); return; }
    const entry=Object.assign({}, u||{}, { usuario:usuarioVal, nombre, cedula, contrasena, rol, activo });
    if(!isNew){
      const idx=ST.usuarios.findIndex(function(x){return x.usuario===usuarioKey;});
      if(idx>=0) ST.usuarios[idx]=entry; else ST.usuarios.push(entry);
    } else { ST.usuarios.push(entry); }
    await savePortalData(); closeModal(); setView('admin'); toast('✅ Usuario guardado correctamente');
  });
}
function editUsuario(usuarioKey){ modalUsuario(usuarioKey); }

async function toggleAcceso(usuarioKey){
  const u=ST.usuarios.find(x=>x.usuario===usuarioKey); if(!u) return;
  u.activo=u.activo===false; // toggle
  await savePortalData(); setView('admin');
  toast(u.activo?'✅ Acceso activado para '+u.nombre:'🔒 Acceso desactivado para '+u.nombre);
}

async function resetPwd(usuarioKey){
  const u=ST.usuarios.find(x=>x.usuario===usuarioKey); if(!u) return;
  if(!confirm('¿Restablecer la contraseña de '+u.nombre+' a su cédula ('+u.cedula+')?')) return;
  u.contrasena=u.cedula;
  await savePortalData(); setView('admin'); toast('Contraseña restablecida a cédula ✓');
}

async function eliminarUsuario(usuario){
  if(!confirm('¿Eliminar al usuario '+usuario+'? (considera solo desactivarlo)')) return;
  ST.usuarios=ST.usuarios.filter(u=>u.usuario!==usuario);
  await savePortalData(); setView('admin'); toast('Usuario eliminado');
}

/* ═══ MODALES: Drive y Contraseña ═══ */
function modalDrive(){
  document.getElementById('modal').innerHTML=`
    <div class="modal-head"><h3>☁ Conectar Google Drive</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      ${ST.scriptUrl?'<div style="background:#d1fae5;color:#065f46;padding:10px 12px;border-radius:8px;margin-bottom:14px;font-size:12.5px;">Conectado: <code style="font-size:10.5px;word-break:break-all;">'+esc(ST.scriptUrl)+'</code></div>':'<div style="background:#fef3c7;color:#92400e;padding:10px 12px;border-radius:8px;margin-bottom:14px;font-size:12.5px;">Sin conexion. Pega la URL del Apps Script abajo.</div>'}
      <div class="field"><label>URL del Apps Script (Code.gs)</label><input id="drUrl" value="${esc(ST.scriptUrl)}" placeholder="https://script.google.com/macros/s/..."></div>
      <p style="font-size:11.5px;color:var(--muted);">Esta URL conecta el portal y TODAS las herramientas a Google Drive. Configúrala una sola vez.</p>
    </div>
    <div class="modal-foot" style="justify-content:space-between;">
      ${ST.scriptUrl?'<button class="btn btn-danger btn-sm" id="drDisc">Desconectar</button>':'<span></span>'}
      <div style="display:flex;gap:8px;"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="drConn">Conectar y probar</button></div>
    </div>`;
  openModal();
  document.getElementById('drConn').addEventListener('click',async()=>{
    const url=document.getElementById('drUrl').value.trim();
    if(!url){ toast('Pega la URL del script'); return; }
    toast('Probando conexión...');
    try{
      const res=await fetch(url+'?tool=portal',{redirect:'follow'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      await res.json();
      ST.scriptUrl=url; loSet('script_url',url);
      await loadPortalData();
      closeModal(); updateDriveStatus(); setView(ST.view); toast('✅ Drive conectado');
    }catch(e){ toast('❌ Error: '+e.message); }
  });
  document.getElementById('drDisc')?.addEventListener('click',()=>{ ST.scriptUrl=''; loSet('script_url',''); closeModal(); updateDriveStatus(); toast('Desconectado'); });
}

function modalPwd(){
  document.getElementById('modal').innerHTML=`
    <div class="modal-head"><h3>🔑 Cambiar mi contraseña</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div style="background:var(--cyan-bg);color:var(--cyan);padding:10px 12px;border-radius:8px;margin-bottom:14px;font-size:12.5px;">
        Puedes cambiar tu contraseña en cualquier momento. La próxima vez que ingreses usa la nueva.
      </div>
      <div class="field"><label>Contraseña actual</label><input type="password" id="pA" placeholder="Tu contraseña actual"></div>
      <div class="field"><label>Nueva contraseña (mínimo 6 caracteres)</label><input type="password" id="pN" placeholder="Nueva contraseña"></div>
      <div class="field"><label>Confirmar nueva contraseña</label><input type="password" id="pC" placeholder="Repite la nueva contraseña"></div>
    </div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="pSave">Cambiar contraseña</button></div>`;
  openModal();
  document.getElementById('pSave').addEventListener('click',async()=>{
    const actual=document.getElementById('pA').value;
    const nueva=document.getElementById('pN').value;
    const conf=document.getElementById('pC').value;
    if(!actual){ toast('Escribe tu contraseña actual'); return; }
    // Verificar contraseña actual
    const entry=buscarUsuario(SES.user, actual);
    if(!entry){ toast('❌ Contraseña actual incorrecta'); return; }
    if(nueva.length<6){ toast('La nueva contraseña debe tener al menos 6 caracteres'); return; }
    if(nueva!==conf){ toast('Las contraseñas no coinciden'); return; }
    // Actualizar en ST.usuarios (o super admin especial)
    const idx=ST.usuarios.findIndex(u=>u.usuario===SES.user);
    if(idx>=0){
      ST.usuarios[idx].contrasena=nueva;
      await savePortalData();
    } else {
      // Super admin — guardar override local
      ST.pwdOverrides[SES.user]=nueva;
      loSet('pwd_overrides',JSON.stringify(ST.pwdOverrides));
    }
    closeModal();
    toast('✅ Contraseña cambiada correctamente. Úsala la próxima vez que ingreses.');
  });
}

function openModal(){ document.getElementById('overlay').classList.add('show'); }
function closeModal(){ document.getElementById('overlay').classList.remove('show'); }
document.getElementById('overlay').addEventListener('click',e=>{ if(e.target.id==='overlay') closeModal(); });

/* ═══ Start ═══ */
init();
</script>
