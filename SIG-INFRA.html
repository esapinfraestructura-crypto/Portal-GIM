<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIG-INFRA — Seguimiento de proyectos</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --navy:#13294b;
  --navy-2:#1d3a63;
  --cyan:#0e7490;
  --cyan-bg:#e0f4f8;
  --amber:#b45309;
  --amber-bg:#fef3e2;
  --slate:#475569;
  --slate-bg:#eef1f4;
  --green:#15803d;
  --green-bg:#e3f5e9;
  --red:#b91c1c;
  --red-bg:#fdecec;
  --bg:#f3f4f6;
  --card:#ffffff;
  --border:#dde1e6;
  --ink:#1b2430;
  --muted:#6b7280;
  --mono:'IBM Plex Mono',monospace;
  --sans:'Public Sans',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:13px;}
h1,h2,h3,h4{margin:0;font-family:var(--sans);}
a{color:var(--cyan);}

#app{max-width:1280px;margin:0 auto;padding:0 20px 60px;}

/* ===== Header ===== */
.topbar{background:var(--navy);color:#fff;padding:16px 20px;margin:0 -20px 24px;}
.topbar-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;}
.brand .ant{width:34px;height:34px;border-radius:8px;object-fit:cover;}
.brand-text .name{font-weight:800;font-size:18px;letter-spacing:.3px;}
.brand-text .sub{font-size:11.5px;color:#b9c6dc;font-family:var(--mono);}
.top-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.role-select{background:var(--navy-2);color:#fff;border:1px solid #2c4a78;border-radius:7px;padding:7px 10px;font-size:13px;font-weight:600;}
.role-select option{color:#111;}
.btn{border-radius:7px;border:1px solid var(--border);background:#fff;padding:8px 14px;font-weight:600;font-size:13px;color:var(--ink);transition:filter .12s;}
.btn:hover{filter:brightness(.97);}
.btn-primary{background:var(--cyan);border-color:var(--cyan);color:#fff;}
.btn-ghost-dark{background:transparent;border-color:#3a567f;color:#fff;}
.btn-ghost-dark:hover{background:#1d3a63;}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-danger{background:#fff;border-color:var(--red);color:var(--red);}

/* ===== Tabs / nav ===== */
.view-tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--border);}
.view-tab{padding:9px 14px;font-weight:700;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;}
.view-tab.active{color:var(--navy);border-bottom-color:var(--navy);}
.nav-tab{padding:13px 20px;font-weight:700;font-size:13.5px;color:var(--muted);background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;transition:color .15s,border-color .15s;}
.nav-tab:hover{color:var(--navy);}
.nav-tab.active{color:var(--navy);border-bottom-color:var(--navy);}

/* ===== Dashboard ===== */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
.stat-card .n{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--navy);}
.stat-card .l{font-size:12px;color:var(--muted);margin-top:2px;}
.phase-pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;}
.ph-precontractual{background:var(--cyan-bg);color:var(--cyan);}
.ph-contractual{background:var(--amber-bg);color:var(--amber);}
.ph-modificaciones{background:var(--slate-bg);color:var(--slate);}
.ph-poscontractual{background:#e7f0fe;color:#1d4ed8;}
.ph-finalizado{background:var(--green-bg);color:var(--green);}

.toolbar-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.search-input{border:1px solid var(--border);border-radius:7px;padding:8px 12px;width:240px;}
.check-inline{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);}

table.proj-table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
table.proj-table th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:#f8f9fb;padding:10px 14px;border-bottom:1px solid var(--border);}
table.proj-table td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
table.proj-table tr:last-child td{border-bottom:none;}
table.proj-table tr.row-link:hover{background:#f8fafc;cursor:pointer;}
.proj-name{font-weight:700;color:var(--navy);}
.proj-meta{font-size:11.5px;color:var(--muted);margin-top:1px;}
.progress-mini{width:100px;height:6px;border-radius:4px;background:#eceff2;overflow:hidden;}
.progress-mini i{display:block;height:100%;background:var(--navy);}
.badge-alert{background:var(--red-bg);color:var(--red);border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700;}
.badge-int{background:#f1e9fc;color:#7c3aed;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700;}

/* ===== Project detail ===== */
.detail-head{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:16px;}
.detail-head .back{font-size:12.5px;color:var(--muted);font-weight:600;border:none;background:none;padding:0;margin-bottom:8px;display:inline-block;}
.detail-head h2{font-size:19px;}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-top:14px;}
.dh-field label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;}
.dh-field input,.dh-field select{width:100%;border:1px solid var(--border);border-radius:6px;padding:6px 8px;}

.proceso-tabs{display:flex;gap:8px;margin-bottom:14px;}
.proceso-tab{border:1px solid var(--border);background:#fff;border-radius:8px;padding:8px 16px;font-weight:700;font-size:13px;color:var(--muted);}
.proceso-tab.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.proceso-tab.add-int{border-style:dashed;color:#7c3aed;border-color:#d8c5f7;background:#f9f5ff;}

.fase-block{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:14px;overflow:hidden;}
.fase-head{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;cursor:pointer;}
.fase-head .left{display:flex;align-items:center;gap:10px;}
.fase-num{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:12px;color:#fff;}
.fase-title{font-weight:700;font-size:14.5px;}
.fase-sub{font-size:11.5px;color:var(--muted);margin-top:1px;}
.fase-progress-txt{font-family:var(--mono);font-size:12px;color:var(--muted);}
.chev{transition:transform .15s;color:var(--muted);}
.fase-block.open .chev{transform:rotate(90deg);}
.fase-body{display:none;border-top:1px solid var(--border);}
.fase-block.open .fase-body{display:block;}

.etapa-row{display:flex;align-items:center;justify-content:space-between;padding:11px 18px;border-bottom:1px solid #eef0f3;gap:12px;}
.etapa-row:last-child{border-bottom:none;}
.etapa-info{display:flex;align-items:center;gap:10px;}
.etapa-name{font-weight:600;font-size:13.5px;}
.etapa-resp{font-size:11px;color:var(--muted);font-family:var(--mono);}
.status-chip{font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap;}
.st-vacio{background:#eceff2;color:var(--muted);}
.st-progreso{background:var(--amber-bg);color:var(--amber);}
.st-completo{background:var(--green-bg);color:var(--green);}
.st-devuelto{background:var(--red-bg);color:var(--red);}

/* ===== Modal ===== */
.overlay{position:fixed;inset:0;background:rgba(15,20,30,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50;}
.overlay.show{display:flex;}
.modal{background:#fff;border-radius:12px;max-width:560px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25);}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{font-size:16px;}
.modal-head .resp-tag{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px;}
.modal-close{border:none;background:none;font-size:18px;color:var(--muted);}
.modal-body{padding:18px 20px;max-height:60vh;overflow-y:auto;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.field{margin-bottom:14px;}
.field label{display:block;font-weight:600;font-size:12.5px;margin-bottom:5px;}
.field input[type=text],.field input[type=number],.field input[type=date],.field input[type=password],.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:7px;padding:8px 10px;}
.field textarea{resize:vertical;min-height:60px;}
.field.chk label{display:flex;align-items:center;gap:8px;font-weight:600;}
.field.chk input{width:16px;height:16px;}
fieldset{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin:0 0 14px;}
fieldset legend{font-weight:600;font-size:12.5px;padding:0 4px;}
.radio{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-bottom:6px;}
.hint{font-size:11.5px;color:var(--muted);margin-top:-8px;margin-bottom:12px;}

table.log-table{width:100%;border-collapse:collapse;margin-bottom:10px;}
table.log-table th{font-size:11px;text-align:left;color:var(--muted);border-bottom:1px solid var(--border);padding:5px 6px;}
table.log-table td{font-size:12.5px;padding:6px 6px;border-bottom:1px solid #eef0f3;}
.log-add{border:1px dashed var(--border);border-radius:8px;padding:12px;background:#fafbfc;margin-top:10px;}
.log-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:10px;}
.log-field{min-width:0;}
.log-field input,.log-field select,.log-field textarea{width:100%;font-size:12.5px;border:1px solid var(--border);border-radius:6px;padding:5px 7px;}
.log-field textarea{min-height:40px;}
.archivo-pill{display:flex;align-items:center;gap:8px;background:#f1f5f9;border:1px solid var(--border);border-radius:7px;padding:6px 10px;margin-bottom:6px;font-size:12.5px;}
.archivo-pill span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.del-link{color:var(--red);font-size:11px;border:none;background:none;font-weight:700;cursor:pointer;}

.empty-state{text-align:center;padding:50px 20px;color:var(--muted);}

#toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:11px 18px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;transform:translateY(10px);transition:.2s;z-index:99;}
#toast.show{opacity:1;transform:translateY(0);}

.loading-wrap{padding:80px 20px;text-align:center;color:var(--muted);}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<script>

/* ============================================================
   SIG-INFRA — lógica de la aplicación
   ============================================================ */

const ROLES = {
  tecnico:      { label:'Técnico responsable (GIM)',      color:'#0e7490', icon:'👷', edita:true },
  juridico:     { label:'Apoyo jurídico (GIM)',            color:'#7c3aed', icon:'⚖️', edita:true },
  financiero:   { label:'Apoyo financiero (GIM)',          color:'#15803d', icon:'💰', edita:true },
  admin:        { label:'Administrador',                  color:'#b45309', icon:'🛠️', edita:true },
  lectura:      { label:'Subdirección / Dirección (solo lectura)', color:'#475569', icon:'🏛️', edita:false }
};

/* ----------------------------------------------------------
   Directorio de usuarios — REEMPLAZAR con el listado real.
   Cada persona necesita: usuario, cédula, contraseña y el rol
   que se le habilita automáticamente al iniciar sesión.
   rol: 'tecnico' | 'juridico' | 'financiero' | 'admin' | 'lectura'
---------------------------------------------------------- */
const DIRECTORIO = [
  // Acceso de respaldo del administrador — úsalo solo si hay un problema con tu usuario real.
  { usuario:'admin', cedula:'0000000000', contrasena:'0000000000', rol:'admin', nombre:'Administrador' },

  // — Listado institucional (LISTADO_DE_PERSONAL.xlsx) —

  { usuario:'saul.jerez', cedula:'91183950', contrasena:'91183950', rol:'juridico', nombre:'Saúl' }, // Saúl Orlando Jerez Ayala
  { usuario:'lizeth.moreno', cedula:'1073131231', contrasena:'1073131231', rol:'tecnico', nombre:'Lizeth' }, // LIZETH JULIANA MORENO HERNANDEZ
  { usuario:'esteban.medrano', cedula:'1049635704', contrasena:'1049635704', rol:'tecnico', nombre:'Esteban' }, // ESTEBAN CAMILO MEDRANO ESPINOSA
  { usuario:'jhonny.hernandez', cedula:'1032409131', contrasena:'1032409131', rol:'tecnico', nombre:'Jhonny' }, // JHONNY ALEXANDER HERNANDEZ MEDINA
  { usuario:'marianella.petro', cedula:'1069496136', contrasena:'1069496136', rol:'tecnico', nombre:'Marianella' }, // MARIANELLA PETRO ALVAREZ
  { usuario:'manuel.rodriguez', cedula:'1070709044', contrasena:'1070709044', rol:'tecnico', nombre:'Manuel' }, // MANUEL ANDRES RODRIGUEZ ANZOLA
  { usuario:'yuri.umana', cedula:'1003627470', contrasena:'1003627470', rol:'tecnico', nombre:'Yuri' }, // YURI XIMENA UMAÑA GONZALEZ
  { usuario:'valentina.bernal', cedula:'1000851673', contrasena:'1000851673', rol:'juridico', nombre:'Valentina' }, // VALENTINA BERNAL TRIANA
  { usuario:'duberly.carvajal', cedula:'1016069981', contrasena:'1016069981', rol:'admin', nombre:'Duberly' }, // Duberly Karime Carvajal Pico
  { usuario:'john.lozano', cedula:'79803305', contrasena:'79803305', rol:'tecnico', nombre:'John' }, // JOHN FREDY LOZANO SIERRA
  { usuario:'alberto.serna', cedula:'79541379', contrasena:'79541379', rol:'juridico', nombre:'Alberto' }, // ALBERTO SERNA ARELLANO
  { usuario:'pio.ayure', cedula:'1018414227', contrasena:'1018414227', rol:'juridico', nombre:'Pio' }, // PIO CAMILO AYURE FLOREZ
  { usuario:'viviana.perdomo', cedula:'1014289075', contrasena:'1014289075', rol:'financiero', nombre:'Viviana' }, // VIVIANA PAOLA PERDOMO MEDINA
  { usuario:'jhon.medina', cedula:'1070973621', contrasena:'1070973621', rol:'financiero', nombre:'Jhon' },
  { usuario:'ivan.cespedes', cedula:'1014271394', contrasena:'1014271394', rol:'lectura', nombre:'Iván' }, // Dr. Iván Céspedes — Coordinador de Infraestructura y Mantenimiento // JHON CAMILO MEDINA GARZON
];

function buscarEnDirectorio(usuario, contrasena){
  const entry = DIRECTORIO.find(d=>d.usuario.toLowerCase()===String(usuario).toLowerCase().trim());
  if(!entry) return null;
  const pwd = (STATE.pwdOverrides && STATE.pwdOverrides[entry.usuario]) || entry.contrasena;
  return pwd === contrasena ? entry : null;
}

/* El técnico responsable puede editar cualquier etapa del proyecto.
   Jurídico y financiero solo editan lo de su dominio o lo marcado
   como 'multiple' (tareas conjuntas del Grupo GIM). Todos pueden VER
   todo siempre; lo único que cambia es si pueden subir información. */
function etapaEditablePorRol(etapaDef, rol){
  if(rol==='admin' || rol==='tecnico') return true;
  if(rol==='juridico') return etapaDef.responsable==='juridico' || etapaDef.responsable==='multiple';
  if(rol==='financiero') return etapaDef.responsable==='financiero' || etapaDef.responsable==='multiple';
  return false; // lectura
}
function puedeEditarEtapa(etapaDef){ return etapaEditablePorRol(etapaDef, STATE.role); }
function puedeAdministrarProyecto(){ return STATE.role==='tecnico' || STATE.role==='admin'; }
function labelResponsable(key){
  if(key==='multiple') return 'Grupo GIM (técnico + jurídico + financiero)';
  return ROLES[key] ? ROLES[key].label : 'Grupo GIM';
}

const FASE_LABEL = {
  precontractual:'Precontractual', contractual:'Contractual',
  modificaciones:'Modificaciones', poscontractual:'Poscontractual', finalizado:'Finalizado'
};

/* ----------------------------------------------------------
   Esquema del flujo real — basado en el documento de fases.
   Solo el Grupo GIM (técnico/jurídico/financiero del proyecto)
   sube información. Donde la evidencia ya vive en SECOP, el
   campo principal es el link — no se duplica el detalle.
---------------------------------------------------------- */
const ETAPAS = {
  precontractual: [
    { id:'identificacion', nombre:'Identificación de la necesidad', responsable:'multiple',
      campos:[
        { id:'origen', label:'Origen de la solicitud', tipo:'select', opciones:['Solicitud','Visita técnica','Requerimiento','Tutela','Emergencia','Vigencia de los servicios'] },
        { id:'descripcion', label:'Descripción de la necesidad', tipo:'textarea' },
        { id:'fecha', label:'Fecha de identificación', tipo:'date' },
        { id:'documento', label:'Documento soporte (recopilación de la necesidad)', tipo:'archivo' }
      ]},
    { id:'cotizacion', nombre:'Cotización y ruta a seguir', responsable:'multiple',
      campos:[
        { id:'numCotizaciones', label:'Número de cotizaciones recibidas', tipo:'number' },
        { id:'ruta', label:'¿Cuántas cotizaciones se recibieron?', tipo:'select', opciones:['2 o más cotizaciones','0 o 1 cotización'] },
        { id:'estudioMercado', label:'Estudio de mercado', tipo:'text', condicion:{ruta:'2 o más cotizaciones'} },
        { id:'empresasContactadas', label:'Empresas contactadas por correo', tipo:'textarea', condicion:{ruta:'0 o 1 cotización'} },
        { id:'valorFinanciera', label:'Valor de referencia fijado', tipo:'text', condicion:{ruta:'0 o 1 cotización'} },
        { id:'estado', label:'Estado', tipo:'select', opciones:['Pendiente','En revisión','Aprobado'] },
        { id:'linkSecop', label:'Link SECOP II', tipo:'text' }
      ]},
    { id:'tipoProceso', nombre:'Selección del tipo de proceso', responsable:'juridico',
      campos:[
        { id:'tipo', label:'Tipo de proceso', tipo:'select', opciones:['Mínima cuantía','Selección abreviada de menor cuantía','Licitación pública'] },
        { id:'interventoria', label:'¿Requiere interventoría?', tipo:'checkbox', condicion:{tipo:'Licitación pública'} }
      ]},
    { id:'estudiosYPrepliego', nombre:'Estudios, formatos y prepliego', responsable:'juridico',
      campos:[
        { id:'estado', label:'Estado', tipo:'select', opciones:['Pendiente','En elaboración','Enviado a aprobación','Aprobado'] },
        { id:'nombreProceso', label:'Nombre del proceso (lo asigna contratación)', tipo:'text' },
        { id:'linkSecop', label:'Link SECOP II — prepliego', tipo:'text' }
      ]},
    { id:'cronograma', nombre:'Cronograma del proceso', responsable:'juridico',
      campos:[
        { id:'observacionesFecha', label:'Fecha límite de observaciones', tipo:'date' },
        { id:'respuesta', label:'Respuesta a observaciones', tipo:'select', opciones:['Pendiente','Procede','No procede'] },
        { id:'modificacionFecha', label:'Fecha de modificación', tipo:'date', condicion:{respuesta:'Procede'} },
        { id:'publicacionDefinitivaFecha', label:'Fecha de publicación definitiva', tipo:'date' },
        { id:'linkSecop', label:'Link SECOP II', tipo:'text' }
      ]},
    { id:'evalHabilitante', nombre:'Evaluación preliminar — Habilitantes', responsable:'multiple',
      campos:[
        { id:'estado', label:'Resultado', tipo:'select', opciones:['Pendiente','Habilitados','Con subsanación','No habilitado'] },
        { id:'subsanacionFecha', label:'Fecha límite de subsanación', tipo:'date', condicion:{estado:'Con subsanación'} },
        { id:'linkSecop', label:'Link SECOP II', tipo:'text' }
      ]},
    { id:'evalPonderable', nombre:'Evaluación final — Ponderables y adjudicación', responsable:'multiple',
      campos:[
        { id:'proponenteGanador', label:'Proponente adjudicado', tipo:'text' },
        { id:'puntaje', label:'Puntaje total', tipo:'number' },
        { id:'fechaAdjudicacion', label:'Fecha de adjudicación', tipo:'date' },
        { id:'numeroContrato', label:'N.º de contrato (SECOP II)', tipo:'text' },
        { id:'linkSecop', label:'Link SECOP II', tipo:'text' }
      ]}
  ],
  contractual: [
    { id:'actaInicio', nombre:'Suscripción del acta de inicio', responsable:'tecnico',
      campos:[
        { id:'fecha', label:'Fecha de suscripción', tipo:'date' },
        { id:'linkSecop', label:'Link SECOP II', tipo:'text' }
      ]},
    { id:'comites', nombre:'Comités semanales de obra', responsable:'tecnico', tipo:'log',
      campoLog:[
        { id:'fecha', label:'Fecha', tipo:'date' },
        { id:'avance', label:'Avance reportado', tipo:'text' },
        { id:'observaciones', label:'Observaciones', tipo:'textarea' },
        { id:'acta', label:'Acta del comité', tipo:'archivo' }
      ]},

/* ----------------------------------------------------------
   Utilidades
---------------------------------------------------------- */
function esc(s){
  if(s===undefined || s===null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function nowISO(){ return new Date().toISOString(); }
function fmtDate(iso){
  if(!iso) return '—';
  try{ const d = new Date(iso); return d.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'}); }
  catch(e){ return iso; }
}
function fmtFechaHora(iso){
  if(!iso) return '—';
  try{ const d = new Date(iso); return d.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'}) + ' · ' + d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}); }
  catch(e){ return iso; }
}
function daysSince(iso){
  if(!iso) return null;
  const ms = Date.now() - new Date(iso).getTime();
  return Math.floor(ms/86400000);
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ----------------------------------------------------------
   Trazabilidad
---------------------------------------------------------- */
function logAccion(proyecto, accion){
  const entrada = {
    fecha: nowISO(),
    persona: STATE.userName || 'Sin nombre',
    rol: STATE.role,
    proyecto: proyecto ? proyecto.nombre : null,
    accion,
    tipo: 'accion'
  };
  if(proyecto){
    if(!proyecto.historial) proyecto.historial = [];
    proyecto.historial.unshift(entrada);
    if(proyecto.historial.length>100) proyecto.historial.length = 100;
  }
  STATE.actividad.unshift(entrada);
  if(STATE.actividad.length>500) STATE.actividad.length = 500;
}

function logDescarga(nombreArchivo, proyecto, etapa){
  const entrada = {
    fecha: nowISO(),
    persona: STATE.userName || 'Sin nombre',
    rol: STATE.role,
    proyecto: proyecto ? proyecto.nombre : null,
    accion: '⬇ Descargó el archivo "'+nombreArchivo+'"'+(etapa?' en "'+etapa+'"':''),
    tipo: 'descarga',
    archivo: nombreArchivo
  };
  if(proyecto){
    if(!proyecto.historial) proyecto.historial = [];
    proyecto.historial.unshift(entrada);
  }
  STATE.actividad.unshift(entrada);
  if(STATE.actividad.length>500) STATE.actividad.length = 500;
  saveProjects(); // guardar inmediatamente
}

// Interceptar clics en links de descarga (delegado desde document)
document.addEventListener('click', function(e){
  const link = e.target.closest('a[download]');
  if(!link || !STATE.role) return;
  const nombreArchivo = link.download || link.getAttribute('download') || 'documento';
  // Obtener proyecto actual si estamos en detail
  const proyecto = STATE.currentProjectId ? getProyecto(STATE.currentProjectId) : null;
  // Obtener etapa del contexto del modal si está abierto
  const etapa = MODAL_CTX?.etapaId || null;
  logDescarga(nombreArchivo, proyecto, etapa);
});

---------------------------------------------------------- */
function campoVacio(campo){
  if(campo.tipo==='checkbox') return false;
  if(campo.tipo==='number') return '';
  return campo.valorDefecto !== undefined ? campo.valorDefecto : '';
}
function etapaVacia(etapa){
  const base = { _obs:'', _vb:{} }; // _obs = observaciones libres; _vb = vistos buenos por rol
  if(etapa.tipo==='log'){ return Object.assign([], base); }
  if(etapa.tipo==='pagos'){
    const d = Object.assign({}, base);
    etapa.campos.forEach(c=>{ d[c.id] = campoVacio(c); });
    d.registros = [];
    return d;
  }
  const d = Object.assign({}, base);
  etapa.campos.forEach(c=>{ d[c.id] = campoVacio(c); });
  return d;
}

/* Mini-badge: muestra cuántos vistos buenos tiene una etapa */
function renderVBCount(valor){
  if(!valor || typeof valor !== 'object') return '';
  const vb = valor._vb || {};
  const n = Object.values(vb).filter(v=>v && v.ok).length;
  if(!n) return '';
  return `<span style="background:#d1fae5;color:#065f46;border-radius:999px;font-size:11px;font-weight:700;padding:2px 8px;">✓ ${n} VB</span>`;
}

function procesoVacio(tipo){
  const proceso = { tipo, creadoEn: nowISO(), actualizadoEn: nowISO() };
  FASES_ORDEN.forEach(fase=>{
    proceso[fase] = {};
    ETAPAS[fase].forEach(etapa=>{
      proceso[fase][etapa.id] = etapaVacia(etapa);
    });
  });
  return proceso;
}

}

function semillaProyectos(){
  return PROYECTOS_REALES.map(p => ({...p}));
}

/* ----------------------------------------------------------
   Almacenamiento — Google Drive (Apps Script) como primario,
   localStorage como caché y respaldo offline.
   Los datos de proyectos se sincronizan en la nube;
   las preferencias personales (rol, sesión) se quedan locales.
---------------------------------------------------------- */
let SCRIPT_URL = '';

function loGet(k){ return localStorage.getItem('lo_'+k); }
function loSet(k,v){ try{ localStorage.setItem('lo_'+k,v); }catch(e){} }
function shGet(k){ return localStorage.getItem('sh_'+k); }
function shSet(k,v){ try{ localStorage.setItem('sh_'+k,v); }catch(e){} }

const TOOL_ID = 'sig-infra'; // identificador de esta herramienta en el portal

async function remoteLoad(){
  if(!SCRIPT_URL) throw new Error('sin url');
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), 4000);
  try{
    const res = await fetch(SCRIPT_URL + '?tool=' + TOOL_ID, {
      redirect:'follow', signal: controller.signal
    });
    clearTimeout(timer);
    if(!res.ok) throw new Error('http '+res.status);
    return await res.json();
  }catch(e){
    clearTimeout(timer);
    throw e;
  }
}
async function remoteSave(payload){
  if(!SCRIPT_URL) return;
  try{
    // Enviamos tool como parámetro URL porque no-cors no permite headers personalizados
    await fetch(SCRIPT_URL + '?tool=' + TOOL_ID, {
      method:'POST', mode:'no-cors', body: payload
    });
  }catch(e){ console.warn('remoteSave error:', e); }
}

async function loadState(){
  SCRIPT_URL = loGet('script_url') || '';
  try{
    STATE.remoteOk = false;
    if(SCRIPT_URL){
      // Timeout de 5 segundos — si Drive no responde, usa caché local
      const timeout = new Promise((_,reject)=>setTimeout(()=>reject(new Error('timeout')),5000));
      const data = await Promise.race([remoteLoad(), timeout]);
      STATE.projects = data.projects || [];
      STATE.actividad = data.actividad || [];
      STATE.projects.forEach(p=>{ if(!p.historial) p.historial=[]; });
      shSet('sigInfraData', JSON.stringify(data));
      STATE.remoteOk = true;
    } else { throw new Error('sin url'); }
  }catch(e){
    const raw = shGet('sigInfraData');
    if(raw){
      try{
        const data = JSON.parse(raw);
        STATE.projects = data.projects || [];
        STATE.actividad = data.actividad || [];
        STATE.projects.forEach(p=>{ if(!p.historial) p.historial=[]; });
      }catch(e2){
        STATE.projects = semillaProyectos();
        STATE.actividad = [];
      }
    } else {
      STATE.projects = semillaProyectos();
      STATE.actividad = [];
      await saveProjects();
    }
  }
  try{ STATE.pwdOverrides = JSON.parse(loGet('pwdOverrides')||'{}'); }catch(e){ STATE.pwdOverrides={}; }
  STATE.role = loGet('role') || null;
  STATE.userName = loGet('userName') || '';
  STATE.currentUsuario = loGet('currentUsuario') || '';
}

async function saveProjects(){
  const payload = JSON.stringify({ projects: STATE.projects, actividad: STATE.actividad });
  shSet('sigInfraData', payload);   // siempre guardar caché local
  await remoteSave(payload);        // intentar remoto (silencioso si falla)
}
function saveRole(role){ STATE.role=role; loSet('role',role); }
function saveUserName(n){ STATE.userName=n; loSet('userName',n); }
function savePwdOverrides(){ loSet('pwdOverrides', JSON.stringify(STATE.pwdOverrides)); }
function saveCurrentUsuario(u){ STATE.currentUsuario=u; loSet('currentUsuario',u); }

async function conectarScript(url){
  url = url.trim();
  if(!url){ showToast('Pega la URL del script'); return false; }
  try{
    showToast('Probando conexión...');
    const res = await fetch(url, {redirect:'follow'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    loSet('script_url', url);
    SCRIPT_URL = url;
    // Si el remoto tiene proyectos, usarlos; si no, subir los locales
    if(data.projects && data.projects.length > 0){
      STATE.projects = data.projects;
      STATE.actividad = data.actividad || [];
      STATE.projects.forEach(p=>{ if(!p.historial) p.historial=[]; });
      shSet('sigInfraData', JSON.stringify(data));
    } else {
      await saveProjects(); // subir datos locales al remoto
    }
    STATE.remoteOk = true;
    showToast('✅ Conectado a Google Drive');
    return true;
  }catch(e){
    showToast('❌ No se pudo conectar: '+e.message);
    return false;
  }
}

function desconectarScript(){
  loSet('script_url','');
  SCRIPT_URL = '';
  STATE.remoteOk = false;
  showToast('Desconectado — los datos siguen guardados localmente');
  render();
}


/* ----------------------------------------------------------
   Cálculos de estado / progreso
---------------------------------------------------------- */
function getProyecto(id){ return STATE.projects.find(p=>p.id===id); }
function getProceso(proyecto, tipo){ return proyecto.procesos.find(p=>p.tipo===tipo); }

function etapaStatus(etapaDef, valor){
  if(valor && typeof valor==='object' && !Array.isArray(valor) && valor._devuelto){
    return { pct:0, label:'⚠ Devuelto', cls:'st-devuelto' };
  }
  if(etapaDef.tipo==='log'){
    const n = (valor||[]).length;
    if(n===0) return { pct:0, label: etapaDef.opcional ? 'Sin modificaciones':'Sin registros', cls:'st-vacio' };
    return { pct:100, label:n+' registro'+(n>1?'s':''), cls:'st-progreso' };
  }
  if(etapaDef.tipo==='pagos'){
    const n = (valor.registros||[]).length;
    const modalidad = valor.modalidad;
    if(!modalidad && n===0) return { pct:0, label:'Sin iniciar', cls:'st-vacio' };
    return { pct: modalidad? 100:50, label: (modalidad||'Modalidad pendiente') + ' · ' + n + ' pago'+(n!==1?'s':''), cls: modalidad?'st-completo':'st-progreso' };
  }
  const campos = etapaDef.campos.filter(c=>{
    if(!c.condicion) return true;
    const [k,v] = Object.entries(c.condicion)[0];
    return valor[k]===v;
  });
  if(campos.length===0) return { pct:0,label:'Sin iniciar',cls:'st-vacio' };
  let llenos=0;
  campos.forEach(c=>{
    const v = valor[c.id];
    if(c.tipo==='checkbox'){ if(v===true) llenos++; }
    else if(v!==undefined && v!==null && String(v).trim()!=='') llenos++;
  });
  const pct = Math.round((llenos/campos.length)*100);
  if(pct===0) return { pct, label:'Sin iniciar', cls:'st-vacio' };
  if(pct===100) return { pct, label:'Completo', cls:'st-completo' };
  return { pct, label:'En progreso · '+pct+'%', cls:'st-progreso' };
}

function faseProgress(faseId, procesoFase){
  const etapas = ETAPAS[faseId];
  let total=0, sum=0;
  etapas.forEach(et=>{
    const st = etapaStatus(et, procesoFase[et.id]);
    if(et.opcional) return;
    total++; sum += st.pct;
  });
  return total? Math.round(sum/total) : 100;
}

function procesoFaseActual(proceso){
  const adjudicado = !!proceso.precontractual.evalPonderable.numeroContrato;
  if(!adjudicado) return 'precontractual';
  const recibo = proceso.poscontractual.recibo;
  if(!recibo || recibo.estado!=='Recibido a satisfacción') return 'contractual';
  if(!proceso.poscontractual.liquidacion.fecha) return 'poscontractual';
  return 'finalizado';
}

function procesoAvanceGeneral(proceso){
  const fase = procesoFaseActual(proceso);
  if(fase==='finalizado') return 100;
  const pesos = { precontractual:55, contractual:35, poscontractual:10 };
  let base = 0;
  if(fase==='contractual') base = pesos.precontractual;
  if(fase==='poscontractual') base = pesos.precontractual+pesos.contractual;
  const pctFaseActual = faseProgress(fase, proceso[fase]);
  return Math.round(base + (pctFaseActual/100)*(pesos[fase]||0));
}

function proyectoResumen(proyecto){
  const principal = getProceso(proyecto,'principal');
  const fase = procesoFaseActual(principal);
  const avance = procesoAvanceGeneral(principal);
  const ultima = principal.actualizadoEn;
  const dias = daysSince(ultima);
  return { fase, avance, dias, ultima };
}

function render(){
  const app = document.getElementById('app');
  if(!STATE.role || !STATE.userName){ app.innerHTML = renderTopbar() + renderRoleGate(); attachRoleGateEvents(); return; }
  let body = '';
  if(STATE.view==='analytics') body = renderAnalytics();
  else if(STATE.view==='dashboard') body = renderDashboard();
  else body = renderDetail();
  app.innerHTML = renderTopbar() + (STATE.view!=='detail' ? renderNavTabs() : '') + body;
  attachGlobalEvents();
  if(STATE.view==='analytics') attachAnalyticsEvents();
  else if(STATE.view==='dashboard') attachDashboardEvents();
  else attachDetailEvents();
}

async function doLogout(){
  logAccion(null,'Cerró sesión');
  await saveProjects();
  saveRole(''); saveUserName(''); saveCurrentUsuario('');
  STATE.role=null; STATE.userName=''; STATE.currentUsuario=''; STATE.view='dashboard';
  render();
}

async function cambiarContrasena(){
  const actual = prompt('Escribe tu contraseña actual:');
  if(actual===null) return;
  const entry = buscarEnDirectorio(STATE.currentUsuario, actual);
  if(!entry){ showToast('❌ Contraseña actual incorrecta'); return; }
  const nueva = prompt('Nueva contraseña (mínimo 6 caracteres):');
  if(!nueva || nueva.length<6){ showToast('La contraseña debe tener al menos 6 caracteres'); return; }
  const confirma = prompt('Confirma la nueva contraseña:');
  if(nueva!==confirma){ showToast('Las contraseñas no coinciden'); return; }
  if(!STATE.pwdOverrides) STATE.pwdOverrides={};
  STATE.pwdOverrides[STATE.currentUsuario] = nueva;
  savePwdOverrides();
  logAccion(null, 'Cambió su contraseña');
  await saveProjects();
  showToast('✅ Contraseña actualizada correctamente');
}

function attachGlobalEvents(){
  document.querySelectorAll('[data-navtab]').forEach(b=>{
    b.addEventListener('click',()=>{ STATE.view=b.dataset.navtab; render(); });
  });
  const lo = document.getElementById('btnLogout');
  if(lo) lo.addEventListener('click', doLogout);
  const cp = document.getElementById('btnCambiarPwd');
  if(cp) cp.addEventListener('click', cambiarContrasena);
  const nv = document.getElementById('btnNuevoProyecto');
  if(nv) nv.addEventListener('click', crearProyecto);
  const im = document.getElementById('btnImportarProyectos');
  if(im) im.addEventListener('click', async ()=>{
    if(!confirm('¿Reemplazar todos los proyectos actuales con los 25 proyectos del plan 2026?\n\nSe perderán los datos ingresados manualmente hasta ahora.')) return;
    STATE.projects = PROYECTOS_REALES.map(p=>({...p, historial:[]}));
    STATE.actividad = [];
    logAccion(null,'Cargó los 25 proyectos del plan de infraestructura 2026');
    await saveProjects();
    render();
    showToast('✅ 25 proyectos del plan 2026 cargados correctamente');
  });
  const dr = document.getElementById('btnDrive');
  if(dr) dr.addEventListener('click', abrirModalDrive);
}

function abrirModalDrive(){
  const overlay = document.getElementById('overlay');
  const modal = document.getElementById('modal');
  const estadoActual = SCRIPT_URL
    ? `<div style="background:#d1fae5;color:#065f46;padding:10px 12px;border-radius:8px;margin-bottom:14px;font-size:12.5px;">
        ✅ Conectado a Google Drive<br><span style="font-size:11px;color:#065f46;opacity:.8;word-break:break-all;">${esc(SCRIPT_URL)}</span>
      </div>`
    : `<div style="background:#fef9c3;color:#92400e;padding:10px 12px;border-radius:8px;margin-bottom:14px;font-size:12.5px;">
        🟡 Sin conexión remota — los datos se guardan solo en este computador.
      </div>`;
  modal.innerHTML = `
    <div class="modal-head"><div><h3>☁ Conectar a Google Drive</h3></div><button class="modal-close" id="modalCloseBtn">✕</button></div>
    <div class="modal-body">
      ${estadoActual}
      <p style="font-size:13px;color:var(--slate);margin:0 0 14px;">Conecta la herramienta a Google Drive para que todos en el equipo compartan los mismos datos en tiempo real.</p>
      <div class="field"><label>URL del Apps Script</label>
        <input type="text" id="driveUrlInput" placeholder="https://script.google.com/macros/s/..." value="${esc(SCRIPT_URL)}" style="font-size:12px;">
        <div style="font-size:11.5px;color:var(--muted);margin-top:5px;">Pega aquí la URL que obtienes al desplegar el script en Google Apps Script.</div>
      </div>
    </div>
    <div class="modal-foot" style="justify-content:space-between;">
      ${SCRIPT_URL?`<button class="btn btn-danger" id="driveDesconectar">Desconectar</button>`:'<span></span>'}
      <div style="display:flex;gap:8px;">
        <button class="btn" id="modalCancel">Cancelar</button>
        <button class="btn btn-primary" id="driveConectar">Conectar y probar</button>
      </div>
    </div>`;
  overlay.classList.add('show');
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('driveConectar').addEventListener('click', async ()=>{
    const url = document.getElementById('driveUrlInput').value;
    const ok = await conectarScript(url);
    if(ok){ closeModal(); render(); }
  });
  const desc = document.getElementById('driveDesconectar');
  if(desc) desc.addEventListener('click', ()=>{ closeModal(); desconectarScript(); });
  overlay.addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeModal(); });
}

function attachRoleGateEvents(){
  const btn = document.getElementById('btnLogin');
  const tryLogin = async ()=>{
    const usuario = document.getElementById('gUsuario').value.trim();
    const contrasena = document.getElementById('gContrasena').value;
    if(!usuario || !contrasena){
      STATE.loginError = 'Completa usuario y contraseña para continuar.'; render(); return;
    }
    const entry = buscarEnDirectorio(usuario, contrasena);
    if(!entry){
      STATE.loginError = 'Usuario o contraseña incorrectos.'; render(); return;
    }
    STATE.loginError = null;
    saveUserName((entry.nombre || entry.usuario) + ' (' + entry.usuario + ')');
    saveRole(entry.rol);
    saveCurrentUsuario(entry.usuario);
    logAccion(null, 'Inició sesión');
    await saveProjects();
    render();
  };
  btn.addEventListener('click', tryLogin);
  document.getElementById('gContrasena').addEventListener('keydown', e=>{ if(e.key==='Enter') tryLogin(); });
}

const ANA_C = { precontractual:'#0e7490', contractual:'#f59e0b', poscontractual:'#3b82f6', finalizado:'#10b981' };

function anaDonut(counts, total){
  const fases=Object.keys(counts); const R=70,ri=44,cx=85,cy=85;
  let a=-Math.PI/2, paths='';
  fases.forEach(function(f){
    const n=counts[f]||0; if(!n) return;
    const slice=(n/total)*2*Math.PI;
    const x1=cx+R*Math.cos(a),y1=cy+R*Math.sin(a);
    const x2=cx+R*Math.cos(a+slice),y2=cy+R*Math.sin(a+slice);
    const xi1=cx+ri*Math.cos(a),yi1=cy+ri*Math.sin(a);
    const xi2=cx+ri*Math.cos(a+slice),yi2=cy+ri*Math.sin(a+slice);
    const lg=slice>Math.PI?1:0;
    paths+='<path d="M'+x1.toFixed(1)+' '+y1.toFixed(1)+' A'+R+' '+R+' 0 '+lg+' 1 '+x2.toFixed(1)+' '+y2.toFixed(1)+' L'+xi2.toFixed(1)+' '+yi2.toFixed(1)+' A'+ri+' '+ri+' 0 '+lg+' 0 '+xi1.toFixed(1)+' '+yi1.toFixed(1)+'Z" fill="'+ANA_C[f]+'" opacity=".93"><title>'+FASE_LABEL[f]+': '+n+'</title></path>';
    a+=slice;
  });
  const leg=fases.map(function(f){
    return '<div style="display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:7px;">'+
      '<span style="width:12px;height:12px;border-radius:3px;background:'+ANA_C[f]+';flex-shrink:0;display:block;"></span>'+
      '<span style="color:#475569;flex:1;">'+FASE_LABEL[f]+'</span>'+
      '<span style="font-weight:700;font-family:IBM Plex Mono,monospace;color:'+ANA_C[f]+';">'+(counts[f]||0)+'</span></div>';
  }).join('');
  return '<div style="text-align:center;">'+
    '<svg viewBox="0 0 170 170" style="width:170px;height:170px;display:inline-block;">'+paths+
    '<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" font-size="26" font-weight="800" fill="#13294b" font-family="IBM Plex Mono,monospace">'+total+'</text>'+
    '<text x="'+cx+'" y="'+(cy+16)+'" text-anchor="middle" font-size="11" fill="#6b7280" font-family="Public Sans,sans-serif">proyectos</text></svg>'+
    '</div>'+
    '<div style="margin-top:14px;padding:0 4px;">'+leg+'</div>';
}

function anaBarrasAvance(P){
  if(!P.length) return '<div style="color:var(--muted);font-size:13px;">Sin proyectos todavía.</div>';
  var sorted=[].concat(P).sort(function(a,b){return proyectoResumen(b).avance-proyectoResumen(a).avance;});
  return sorted.map(function(p){
    var r=proyectoResumen(p);
    var c=ANA_C[r.fase]||'#6b7280';
    var nombre=p.nombre.length>28?p.nombre.slice(0,26)+'\u2026':p.nombre;
    return '<div style="margin-bottom:11px;">'+
      '<div style="display:flex;justify-content:space-between;margin-bottom:3px;">'+
        '<span style="font-size:12px;font-weight:600;color:#1b2430;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:78%;">'+esc(nombre)+'</span>'+
        '<span style="font-size:12px;font-family:IBM Plex Mono,monospace;font-weight:700;color:'+c+';">'+r.avance+'%</span>'+
      '</div>'+
      '<div style="height:9px;background:#f1f3f5;border-radius:5px;overflow:hidden;">'+
        '<div style="height:100%;width:'+r.avance+'%;background:'+c+';border-radius:5px;"></div>'+
      '</div>'+
      '<div style="font-size:10.5px;color:var(--muted);margin-top:2px;">'+FASE_LABEL[r.fase]+(p.tecnicoResponsable?' · '+p.tecnicoResponsable:'')+'</div>'+
    '</div>';
  }).join('');
}

function anaBarrasTecnico(P){
  var mapa={};
  P.forEach(function(p){
    var t=p.tecnicoResponsable||'Sin asignar';
    if(!mapa[t]) mapa[t]={total:0,sum:0};
    mapa[t].total++; mapa[t].sum+=proyectoResumen(p).avance;
  });
  var items=Object.entries(mapa).sort(function(a,b){return b[1].total-a[1].total;}).slice(0,8);
  var maxN=Math.max(1,Math.max.apply(null,items.map(function(i){return i[1].total;})));
  if(!items.length) return '<div style="color:var(--muted);">Sin técnicos asignados.</div>';
  return items.map(function(item){
    var nombre=item[0]; var d=item[1];
    var w=Math.round((d.total/maxN)*100);
    var avg=Math.round(d.sum/d.total);
    var n=nombre.length>22?nombre.slice(0,20)+'\u2026':nombre;
    return '<div style="margin-bottom:12px;">'+
      '<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;">'+
        '<span style="font-weight:600;color:#1b2430;">'+esc(n)+'</span>'+
        '<span style="color:var(--muted);">'+d.total+' proy · '+avg+'% avg</span>'+
      '</div>'+
      '<div style="height:26px;background:#f1f3f5;border-radius:7px;overflow:hidden;">'+
        '<div style="height:100%;width:'+w+'%;background:linear-gradient(90deg,#13294b,#0e7490);border-radius:7px;display:flex;align-items:center;padding-left:10px;">'+
          (w>18?'<span style="font-size:12px;color:#fff;font-weight:700;">'+d.total+'</span>':'')+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('');
}

function anaSemaforo(P){
  var alert_=P.filter(function(p){var r=proyectoResumen(p);return r.dias>15&&r.fase!=='finalizado';});
  var ok=P.filter(function(p){var r=proyectoResumen(p);return r.dias<=7&&r.fase!=='finalizado';});
  var mid=P.filter(function(p){var r=proyectoResumen(p);return r.dias>7&&r.dias<=15&&r.fase!=='finalizado';});
  var lista=alert_.length>0?'<div style="margin-top:12px;">'+alert_.map(function(p){
    return '<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #fecaca;font-size:12px;">'+
      '<span style="color:#dc2626;font-weight:700;">\u26A0</span>'+
      '<span style="font-weight:600;color:#1b2430;">'+esc(p.nombre)+'</span>'+
      '<span style="color:var(--muted);margin-left:auto;">'+proyectoResumen(p).dias+'d · '+(p.tecnicoResponsable||'Sin técnico')+'</span></div>';
  }).join('')+'</div>':'';
  return '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;">'+
    '<div style="background:#d1fae5;border-radius:10px;padding:14px;text-align:center;"><div style="font-size:24px;font-weight:800;color:#065f46;font-family:IBM Plex Mono,monospace;">'+ok.length+'</div><div style="font-size:11px;color:#065f46;font-weight:600;margin-top:2px;">Al día (≤7d)</div></div>'+
    '<div style="background:#fef9c3;border-radius:10px;padding:14px;text-align:center;"><div style="font-size:24px;font-weight:800;color:#92400e;font-family:IBM Plex Mono,monospace;">'+mid.length+'</div><div style="font-size:11px;color:#92400e;font-weight:600;margin-top:2px;">Por revisar (8–15d)</div></div>'+
    '<div style="background:#fee2e2;border-radius:10px;padding:14px;text-align:center;"><div style="font-size:24px;font-weight:800;color:#991b1b;font-family:IBM Plex Mono,monospace;">'+alert_.length+'</div><div style="font-size:11px;color:#991b1b;font-weight:600;margin-top:2px;">Sin movimiento (>15d)</div></div>'+
  '</div>'+lista;
}

function anaFasesStack(counts, total){
  var bars=Object.entries(counts).map(function(entry){
    var f=entry[0],n=entry[1];
    var pct=Math.round((n/total)*100);
    return pct?'<div style="width:'+pct+'%;background:'+ANA_C[f]+';height:100%;" title="'+FASE_LABEL[f]+': '+n+'"></div>':'';
  }).join('');
  var labels=Object.entries(counts).map(function(entry){
    var f=entry[0],n=entry[1];
    return '<span style="display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#475569;">'+
      '<span style="width:9px;height:9px;border-radius:2px;background:'+ANA_C[f]+';display:block;"></span>'+
      FASE_LABEL[f]+' · '+Math.round((n/total)*100)+'%</span>';
  }).join('');
  return '<div style="height:14px;border-radius:7px;overflow:hidden;display:flex;margin-bottom:10px;">'+bars+'</div>'+
    '<div style="display:flex;gap:16px;flex-wrap:wrap;">'+labels+'</div>';
}

function renderAnalytics(){
  var P=STATE.projects;
  var counts={precontractual:0,contractual:0,poscontractual:0,finalizado:0};
  var totalCDP=0,nCDP=0,totalAvance=0;
  P.forEach(function(p){
    var r=proyectoResumen(p); counts[r.fase]=(counts[r.fase]||0)+1; totalAvance+=r.avance;

  });

  var sinMovimiento=P.filter(function(p){var r=proyectoResumen(p);return r.dias>15&&r.fase!=='finalizado';}).length;
  var total=P.length||1;

  var isAdmin = STATE.role==='admin';

    var esDescarga=a.tipo==='descarga';

        '<div style="display:flex;justify-content:space-between;margin-bottom:1px;">'+
          '<strong style="color:'+(esDescarga?'#b45309':'#1b2430')+';">'+esc(a.persona)+(esDescarga?' <span style=\"font-size:10px;background:#fef3cd;color:#b45309;border-radius:4px;padding:1px 5px;\">DESCARGA</span>':'')+
          '</strong>'+
          '<span style="font-size:10.5px;color:var(--muted);white-space:nowrap;margin-left:8px;">'+fmtFechaHora(a.fecha)+'</span>'+
        '</div>'+
        '<div style="color:#475569;">'+esc(a.accion)+(a.proyecto?' · <em style=\"color:var(--muted)\">'+esc(a.proyecto)+'</em>':'')+'</div>'+
      '</div>'+
    '</div>';

  return '<div style="background:#f8f9fb;min-height:100%;padding-bottom:40px;">'+

  '<div class="stat-row" style="margin-bottom:16px;">'+
    '<div class="stat-card" style="border-top:3px solid #0e7490;"><div class="n" style="color:#0e7490;">'+total+'</div><div class="l">Proyectos totales</div></div>'+
    '<div class="stat-card" style="border-top:3px solid #10b981;"><div class="n" style="color:#10b981;">'+avgAvance+'%</div><div class="l">Avance promedio</div></div>'+
    '<div class="stat-card" style="border-top:3px solid #f59e0b;"><div class="n" style="color:#f59e0b;">'+(counts.contractual||0)+'</div><div class="l">En ejecución</div></div>'+
    '<div class="stat-card" style="border-top:3px solid #10b981;"><div class="n" style="color:#10b981;">'+(counts.finalizado||0)+'</div><div class="l">Finalizados</div></div>'+
    '<div class="stat-card" style="border-top:3px solid '+(sinMovimiento>0?'#ef4444':'#10b981')+';"><div class="n" style="color:'+(sinMovimiento>0?'#ef4444':'#10b981')+';">'+(sinMovimiento>0?sinMovimiento:'✓')+'</div><div class="l">Sin movimiento >15d</div></div>'+
    (nCDP>0?'<div class="stat-card" style="border-top:3px solid #8b5cf6;"><div class="n" style="color:#8b5cf6;font-size:18px;">'+(totalCDP/1e6).toFixed(1)+'M</div><div class="l">Presupuesto CDP</div></div>':'')+

  '<!-- Barra de distribución -->'+
  '<div style="background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:16px;">'+
    '<h4 style="margin:0 0 10px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;">Distribución general por fase</h4>'+
    anaFasesStack(counts,total)+
  '</div>'+

  '<!-- Fila 1: donut + avance -->'+
  '<div style="display:grid;grid-template-columns:230px 1fr;gap:16px;margin-bottom:16px;">'+
    '<div style="background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px 16px;">'+
      '<h4 style="margin:0 0 10px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:center;">Proyectos por fase</h4>'+
      anaDonut(counts,total)+
    '</div>'+
    '<div style="background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;overflow-y:auto;max-height:380px;">'+

      '<h4 style="margin:0 0 14px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;">⚠ Semáforo de actividad</h4>'+
      anaSemaforo(P)+

  '<div style="background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;">'+
    '<div style="padding:14px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">'+
      '<h4 style="margin:0;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;">🕓 Trazabilidad completa — quién hizo qué y cuándo</h4>'+

function renderDashboard(){
  const projects = STATE.projects;
  const FASE_C = { precontractual:'#0e7490', contractual:'#b45309', poscontractual:'#1d4ed8', finalizado:'#15803d' };

  const filteredProjects = projects
    .filter(p=>p.nombre.toLowerCase().includes(STATE.search.toLowerCase()))
    .filter(p=>{
      if(!STATE.onlyMine || !STATE.role || STATE.role==='admin' || STATE.role==='lectura') return true;
      return proyectoTienePendienteDeRol(p, STATE.role);
    });

  let rows = filteredProjects.map(p=>{
    const r = proyectoResumen(p);
    const alerta = r.dias!==null && r.dias>15 && r.fase!=='finalizado';
    const interv = getProceso(p,'principal').precontractual.tipoProceso.interventoria;
    return `<tr class="row-link" data-id="${p.id}">
      <td><div class="proj-name">${esc(p.nombre)}</div><div class="proj-meta">${esc(p.dependencia||'—')}</div></td>
      <td style="font-size:12.5px;">${p.tecnicoResponsable?esc(p.tecnicoResponsable):'<span class="proj-meta">Sin asignar</span>'}</td>
      <td><span class="phase-pill ph-${r.fase}">${FASE_LABEL[r.fase]}</span></td>
      <td style="min-width:130px;">
        <div style="display:flex;align-items:center;gap:8px;">
          <div style="flex:1;height:6px;border-radius:4px;background:#eceff2;overflow:hidden;"><div style="height:100%;width:${r.avance}%;background:${FASE_C[r.fase]||'#0e7490'};border-radius:4px;"></div></div>
          <span style="font-family:var(--mono);font-size:11.5px;font-weight:700;">${r.avance}%</span>
        </div>
      </td>
      <td>${interv?'<span class="badge-int">Con interventoría</span>':'<span class="proj-meta">—</span>'}</td>
      <td>${alerta?`<span class="badge-alert">⚠ ${r.dias}d</span>`:`<span class="proj-meta">${fmtDate(r.ultima)}</span>`}</td>
    </tr>`;
  }).join('');
  if(!rows) rows = `<tr><td colspan="6"><div class="empty-state">Sin proyectos que coincidan.</div></td></tr>`;

  return `
  <div class="toolbar-row">
    <input class="search-input" id="searchInput" placeholder="Buscar proyecto..." value="${esc(STATE.search)}">
    <label class="check-inline"><input type="checkbox" id="onlyMineChk" ${STATE.onlyMine?'checked':''}> Solo mis pendientes</label>
    ${STATE.role==='admin'?`<button class="btn btn-sm" id="btnImportarProyectos" style="border-color:#b45309;color:#b45309;font-weight:700;">↺ Cargar proyectos del plan 2026</button>`:''}
  </div>
  <table class="proj-table">
    <thead><tr><th>Proyecto</th><th>Técnico responsable</th><th>Fase actual</th><th>Avance</th><th>Interventoría</th><th>Última actividad</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function proyectoTienePendienteDeRol(p, role){
  for(const proceso of p.procesos){
    for(const fase of FASES_ORDEN){
      for(const et of ETAPAS[fase]){
        if(!etapaEditablePorRol(et, role)) continue;
        const st = etapaStatus(et, proceso[fase][et.id]);
        if(st.pct<100) return true;
      }
    }
  }
  return false;
}

function attachDashboardEvents(){
  document.querySelectorAll('[data-navtab]').forEach(b=>{
    b.addEventListener('click',()=>{ STATE.view=b.dataset.navtab; render(); });
  });
  document.querySelectorAll('tr.row-link').forEach(tr=>{
    tr.addEventListener('click', ()=>{
      STATE.currentProjectId = tr.dataset.id;
      STATE.currentProcesoTipo = 'principal';
      STATE.view = 'detail';
      render();
    });
  });
  const si = document.getElementById('searchInput');
  if(si) si.addEventListener('input', e=>{
    STATE.search = e.target.value;
    render();
    const si2 = document.getElementById('searchInput');
    if(si2){ si2.focus(); si2.setSelectionRange(si2.value.length, si2.value.length); }
  });
  const om = document.getElementById('onlyMineChk');
  if(om) om.addEventListener('change', e=>{ STATE.onlyMine = e.target.checked; render(); });
  const nuevo = document.getElementById('btnNuevoProyecto');
  if(nuevo) nuevo.addEventListener('click', crearProyecto);
}

async function crearProyecto(){
  const nombre = prompt('Nombre del nuevo proyecto:');
  if(!nombre) return;
  const id = 'P'+String(STATE.projects.length+1).padStart(2,'0')+'_'+Math.random().toString(36).slice(2,5);
  const p = nuevoProyecto(id, nombre);
  logAccion(p, 'Creó el proyecto');
  STATE.projects.push(p);
  await saveProjects();
  render();
  showToast('Proyecto creado');
}

async function eliminarProyecto(){
  const p = getProyecto(STATE.currentProjectId);
  if(!p) return;
  const conf = confirm('¿Eliminar el proyecto "'+p.nombre+'"? Esta acción no se puede deshacer.');
  if(!conf) return;
  logAccion(null, 'Eliminó el proyecto "'+p.nombre+'"');
  STATE.projects = STATE.projects.filter(x=>x.id!==p.id);
  await saveProjects();
  STATE.view='dashboard';
  render();
  showToast('Proyecto eliminado');
}

    const p = getProyecto(STATE.currentProjectId);

      const anterior = p.nombre;

/* ---------------- Modal de etapa ---------------- */
function findEtapaDef(faseId, etapaId){ return ETAPAS[faseId].find(e=>e.id===etapaId); }

function openEtapaModal(projectId, procesoTipo, faseId, etapaId){
  const proyecto = getProyecto(projectId);
  const proceso = getProceso(proyecto, procesoTipo);
  const snapshot = JSON.parse(JSON.stringify(proceso[faseId][etapaId]));
  MODAL_CTX = { projectId, procesoTipo, faseId, etapaId,
    formData: JSON.parse(JSON.stringify(snapshot)),
    original: snapshot };
  renderModal();
  document.getElementById('overlay').classList.add('show');
}
function closeModal(){
  document.getElementById('overlay').classList.remove('show');
  MODAL_CTX = null;
}

function renderModal(){
  const { faseId, etapaId, formData } = MODAL_CTX;
  const etapaDef = findEtapaDef(faseId, etapaId);
  const resp = labelResponsable(etapaDef.responsable);
  const editable = puedeEditarEtapa(etapaDef);
  let bodyHtml = '';

  if(formData && typeof formData==='object' && !Array.isArray(formData) && formData._devuelto){
    bodyHtml += `<div style="background:var(--red-bg);color:var(--red);padding:10px 12px;border-radius:8px;margin-bottom:14px;font-size:12.5px;">
      <strong>Devuelto</strong> el ${fmtDate(formData._devuelto.fecha)} por ${esc(formData._devuelto.por)} — ${esc(formData._devuelto.motivo)}
    </div>`;
  }
  if(!editable && STATE.role!=='lectura'){
    bodyHtml += `<div style="background:var(--slate-bg);color:var(--slate);padding:10px 12px;border-radius:8px;margin-bottom:14px;font-size:12.5px;">
      Esta etapa la gestiona <strong>${esc(resp)}</strong>. Puedes verla, pero solo esa persona puede editarla.
    </div>`;
  }

  if(etapaDef.tipo==='log' || etapaDef.tipo==='pagos'){
    bodyHtml += renderLogSection(etapaDef, formData, editable);
  } else {
    bodyHtml += etapaDef.campos.map(c=>renderCampoWrap(c, formData, editable)).join('');
  }

  // ── Observaciones y Visto Bueno ──
  bodyHtml += renderObsVB(formData, editable);

  const puedeDevolver = editable && etapaDef.tipo!=='log';

  document.getElementById('modal').innerHTML = `
    <div class="modal-head">
      <div><h3>${esc(etapaDef.nombre)}</h3></div>
      <button class="modal-close" id="modalCloseBtn">✕</button>
    </div>
    <div class="modal-body" id="modalBody">${bodyHtml}</div>
    <div class="modal-foot">
      ${puedeDevolver? `<button class="btn btn-danger" id="modalDevolver" style="margin-right:auto;">↩️ Devolver</button>` : ''}
      <button class="btn" id="modalCancel">${editable?'Cancelar':'Cerrar'}</button>
      ${editable? `<button class="btn btn-primary" id="modalSave">Guardar</button>` : ''}
    </div>`;
  attachModalEvents();
}

function renderObsVB(formData, editable){
  const isArr = Array.isArray(formData);
  const data = isArr ? {} : (formData || {});
  const vb = data._vb || {};
  const obs = data._obs || '';

  const rolesVB = [
    { key:'tecnico', label:'Técnico responsable' },
    { key:'juridico', label:'Apoyo jurídico' },
    { key:'financiero', label:'Apoyo financiero' }
  ];

  const vbItems = rolesVB.map(rv=>{
    const entry = vb[rv.key];
    const puedeFirmar = !isArr && editable && STATE.role===rv.key;
    const firmado = entry && entry.ok;
    return `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f1f3f5;">
      <div style="flex:1;font-size:12.5px;">
        <span style="font-weight:600;">${rv.label}</span>
        ${firmado
          ? `<span style="color:#065f46;font-size:11.5px;margin-left:8px;">✓ Visto bueno — ${esc(entry.nombre)} · ${fmtDate(entry.fecha)}</span>`
          : `<span style="color:var(--muted);font-size:11.5px;margin-left:8px;">Pendiente</span>`}
        ${entry&&entry.obs ? `<div style="font-size:11px;color:#475569;margin-top:2px;font-style:italic;">"${esc(entry.obs)}"</div>` : ''}
      </div>
      ${puedeFirmar && !firmado ? `<button class="btn btn-sm btn-primary" data-vb="${rv.key}">✓ Dar VB</button>` : ''}
      ${puedeFirmar && firmado ? `<button class="btn btn-sm btn-danger" data-vb-remove="${rv.key}">Quitar VB</button>` : ''}
    </div>`;
  }).join('');

  const obsSection = !isArr ? `
    <div class="field" style="margin-top:12px;">
      <label>Observaciones de la etapa</label>
      <textarea data-obs style="width:100%;border:1px solid var(--border);border-radius:7px;padding:8px 10px;min-height:60px;font-size:13px;resize:vertical;" ${!editable?'disabled':''}>${esc(obs)}</textarea>
    </div>` : '';

  return `
    <div style="margin-top:18px;border-top:2px solid var(--border);padding-top:14px;">
      <h4 style="margin:0 0 10px;font-size:13px;color:var(--navy);">Vistos buenos y observaciones</h4>
      ${vbItems}
      ${obsSection}
    </div>`;
}


function renderCampoWrap(campo, formData, editable){
  if(campo.condicion){
    const [k,v] = Object.entries(campo.condicion)[0];
    if(formData[k]!==v) return '';
  }
  return `<div class="field ${campo.tipo==='checkbox'?'chk':''}">${renderCampo(campo, formData[campo.id], editable)}</div>`;
}

function renderCampo(campo, valor, editable, compact){
  const dataAttr = `data-field="${campo.id}"`;
  const dis = editable===false ? 'disabled' : '';
  const lbl = compact
    ? `<label style="font-size:10.5px;color:var(--muted);display:block;margin-bottom:3px;">${esc(campo.label)}</label>`
    : `<label>${esc(campo.label)}</label>`;

  switch(campo.tipo){
    case 'text':
      return `${lbl}<input type="text" ${dataAttr} value="${esc(valor)}" ${dis}>`;
    case 'textarea':
      return `${lbl}<textarea ${dataAttr} ${dis} rows="2">${esc(valor)}</textarea>`;
    case 'number':
      return `${lbl}<input type="number" ${dataAttr} value="${valor===undefined||valor===null?'':valor}" ${dis}>`;
    case 'date':
      return `${lbl}<input type="date" ${dataAttr} value="${esc(valor)}" ${dis}>`;
    case 'checkbox':
      return `<label><input type="checkbox" ${dataAttr} ${valor?'checked':''} ${dis}> ${esc(campo.label)}</label>`;
    case 'select':
      return `${lbl}<select ${dataAttr} ${dis}>
        <option value="">Selecciona...</option>
        ${campo.opciones.map(o=>`<option value="${esc(o)}" ${o===valor?'selected':''}>${esc(o)}</option>`).join('')}
      </select>`;
    case 'radio':
      return `<fieldset><legend>${esc(campo.label)}</legend>${campo.opciones.map(o=>`
        <label class="radio"><input type="radio" name="${campo.id}" ${dataAttr} value="${esc(o.value)}" ${o.value===valor?'checked':''} ${dis}> ${esc(o.label)}</label>`).join('')}</fieldset>`;
    case 'archivo':{
      const archivo = valor && typeof valor==='object' ? valor : null;
      const visor = archivo
        ? `<div class="archivo-pill"><span>📄 ${esc(archivo.nombre)}</span><a href="${esc(archivo.data)}" download="${esc(archivo.nombre)}" class="btn btn-sm" style="padding:3px 8px;font-size:11px;">Descargar</a>${editable?`<button class="del-link" data-clear-file="${campo.id}" style="margin-left:6px;">Quitar</button>`:''}</div>`
        : '';
      const picker = editable
        ? `<input type="file" ${dataAttr} accept=".pdf,.doc,.docx,.png,.jpg,.jpeg,.xls,.xlsx" style="display:block;margin-top:4px;font-size:12px;">`
        : '';
      return `${lbl}${visor}${picker}`;
    }
    default: return '';
  }
}

function renderLogSection(etapaDef, formData, editable){
  const isPagos = etapaDef.tipo==='pagos';
  const registros = isPagos ? formData.registros : (Array.isArray(formData)?formData:[]);
  let modalidadHtml = '';
  if(isPagos){
    modalidadHtml = etapaDef.campos.map(c=>renderCampoWrap(c, formData, editable)).join('');
  }
  const cols = etapaDef.campoLog;

  // Table: show archivo as pill with download, skip long textareas (show truncated)
  const headerRow = `<tr>${cols.map(c=>`<th>${esc(c.label)}</th>`).join('')}<th></th></tr>`;
  const dataRows = registros.map((r,idx)=>`<tr>${cols.map(c=>{
    if(c.tipo==='date') return `<td>${fmtDate(r[c.id])}</td>`;
    if(c.tipo==='archivo'){
      const f = r[c.id] && typeof r[c.id]==='object' ? r[c.id] : null;
      return `<td>${f?`<a href="${esc(f.data)}" download="${esc(f.nombre)}" style="font-size:11.5px;">📄 ${esc(f.nombre)}</a>`:'—'}</td>`;
    }
    if(c.tipo==='textarea'){
      const txt = r[c.id]||'';
      return `<td title="${esc(txt)}">${esc(txt.length>40?txt.slice(0,40)+'…':txt)}</td>`;
    }
    return `<td>${esc(r[c.id])}</td>`;
  }).join('')}<td>${editable?`<button class="del-link" data-del-row="${idx}">✕</button>`:''}</td></tr>`).join('');

  // Add-row form: compact inline grid
  let addBox = '';
  if(editable){
    const addFields = cols.map(c=>`<div class="log-field">${renderCampo(c, '', true, true)}</div>`).join('');
    addBox = `<div class="log-add" id="logAddBox" data-cols="${cols.map(c=>c.id).join(',')}">
      <div class="log-grid">${addFields}</div>
      <button class="btn btn-sm btn-primary" id="addRowBtn">+ Agregar registro</button>
    </div>`;
  }

  return `
    ${modalidadHtml}
    <table class="log-table"><thead>${headerRow}</thead><tbody>${dataRows || `<tr><td colspan="${cols.length+1}" style="color:var(--muted);font-size:12.5px;padding:10px 6px;">Sin registros todavía</td></tr>`}</tbody></table>
    ${addBox}`;
}

function attachModalEvents(){
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  const saveBtn = document.getElementById('modalSave');
  if(saveBtn) saveBtn.addEventListener('click', saveModal);
  const devBtn = document.getElementById('modalDevolver');
  if(devBtn) devBtn.addEventListener('click', devolverEtapa);
  document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeModal(); });

  document.querySelectorAll('#modalBody [data-field]').forEach(input=>{
    if(input.type==='file') input.addEventListener('change', onFileInput);
    else { input.addEventListener('input', onFieldInput); input.addEventListener('change', onFieldInput); }
  });
  const addBtn = document.getElementById('addRowBtn');
  if(addBtn) addBtn.addEventListener('click', addLogRow);
  document.querySelectorAll('[data-del-row]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const idx = parseInt(b.dataset.delRow,10);
      const etapaDef = findEtapaDef(MODAL_CTX.faseId, MODAL_CTX.etapaId);
      const arr = etapaDef.tipo==='pagos' ? MODAL_CTX.formData.registros : MODAL_CTX.formData;
      arr.splice(idx,1);
      renderModal();
    });
  });
  document.querySelectorAll('[data-clear-file]').forEach(b=>{
    b.addEventListener('click', ()=>{
      MODAL_CTX.formData[b.dataset.clearFile] = null;
      renderModal();
    });
  });

  // Visto bueno buttons
  document.querySelectorAll('[data-vb]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const rolKey = b.dataset.vb;
      const obs = prompt('Observación para el visto bueno (opcional):') || '';
      if(!MODAL_CTX.formData._vb) MODAL_CTX.formData._vb = {};
      MODAL_CTX.formData._vb[rolKey] = {
        ok: true,
        nombre: STATE.userName,
        fecha: nowISO(),
        obs: obs.trim()
      };
      renderModal();
    });
  });
  document.querySelectorAll('[data-vb-remove]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const rolKey = b.dataset.vbRemove;
      if(MODAL_CTX.formData._vb) delete MODAL_CTX.formData._vb[rolKey];
      renderModal();
    });
  });

  // Observaciones textarea
  const obsEl = document.querySelector('#modalBody [data-obs]');
  if(obsEl) obsEl.addEventListener('input', ()=>{ MODAL_CTX.formData._obs = obsEl.value; });
}

function onFieldInput(e){
  const el = e.target;
  const key = el.dataset.field;
  let val;
  if(el.type==='checkbox') val = el.checked;
  else if(el.type==='number') val = el.value===''? '' : Number(el.value);
  else val = el.value;
  MODAL_CTX.formData[key] = val;
  const etapaDef = findEtapaDef(MODAL_CTX.faseId, MODAL_CTX.etapaId);
  const hasConditional = etapaDef.campos && etapaDef.campos.some(c=>c.condicion);
  if(hasConditional) renderModal();
}

function onFileInput(e){
  const el = e.target;
  const key = el.dataset.field;
  const file = el.files[0];
  if(!file) return;
  if(file.size > 4*1024*1024){ showToast('El archivo supera 4 MB — usa un archivo más liviano'); el.value=''; return; }
  const reader = new FileReader();
  reader.onload = ()=>{
    MODAL_CTX.formData[key] = { nombre: file.name, tipo: file.type, data: reader.result };
    renderModal();
    showToast('Archivo cargado: '+file.name);
  };
  reader.readAsDataURL(file);
}

// For log-add rows, file fields need async reading — store pending files then push
let _pendingLogFiles = {};

function addLogRow(){
  const box = document.getElementById('logAddBox');
  const cols = box.dataset.cols.split(',');
  const inputs = box.querySelectorAll('[data-field]');
  const row = {};
  let vacio = true;

  // Check for pending async file reads
  const fileInputs = Array.from(inputs).filter(i=>i.type==='file');
  if(fileInputs.some(i=>i.files[0])){
    // Read all files first, then push
    const promises = Array.from(inputs).map((input, idx)=>{
      const colId = cols[idx];
      if(!colId) return Promise.resolve();
      if(input.type==='file'){
        const file = input.files[0];
        if(!file){ row[colId]=null; return Promise.resolve(); }
        if(file.size>4*1024*1024){ showToast('Archivo demasiado grande (máx 4 MB)'); return Promise.resolve(); }
        return new Promise(res=>{
          const r = new FileReader();
          r.onload = ()=>{ row[colId]={nombre:file.name,tipo:file.type,data:r.result}; vacio=false; res(); };
          r.readAsDataURL(file);
        });
      } else {
        let v = input.type==='checkbox'?input.checked:input.value;
        if(v) vacio = false;
        row[colId] = v;
        return Promise.resolve();
      }
    });
    Promise.all(promises).then(()=>{
      if(vacio){ showToast('Completa al menos un campo del registro'); return; }
      _pushLogRow(row);
    });
    return;
  }

  cols.forEach((colId,i)=>{
    const input = inputs[i];
    if(!input) return;
    let v = input.type==='checkbox'?input.checked:input.value;
    if(v) vacio = false;
    row[colId] = v;
  });
  if(vacio){ showToast('Completa al menos un campo del registro'); return; }
  _pushLogRow(row);
}

function _pushLogRow(row){
  const etapaDef = findEtapaDef(MODAL_CTX.faseId, MODAL_CTX.etapaId);
  if(etapaDef.tipo==='pagos') MODAL_CTX.formData.registros.push(row);
  else MODAL_CTX.formData.push(row);
  renderModal();
}

function describirCambioEtapa(etapaDef, original, formData){
  const acciones = [];
  if(etapaDef.tipo==='log'){
    const diff = formData.length - (original.length||0);
    if(diff>0) acciones.push('Agregó '+diff+' registro'+(diff>1?'s':''));
    if(diff<0) acciones.push('Eliminó '+(-diff)+' registro'+((-diff)>1?'s':''));
    if(!acciones.length) acciones.push('Actualizó registros');
  } else if(etapaDef.tipo==='pagos'){
    const diff = (formData.registros||[]).length - ((original.registros||[]).length||0);
    if(diff>0) acciones.push('Agregó '+diff+' pago'+(diff>1?'s':''));
    else if(diff<0) acciones.push('Eliminó '+(-diff)+' pago'+((-diff)>1?'s':''));
    else acciones.push('Actualizó pagos');
  } else {
    acciones.push('Actualizó información');
  }
  // Check VB changes
  const origVB = (original && original._vb) || {};
  const newVB = (formData && formData._vb) || {};
  Object.keys(newVB).forEach(rol=>{
    if(!origVB[rol] && newVB[rol] && newVB[rol].ok) acciones.push('Dio VB ('+rol+')');
  });
  Object.keys(origVB).forEach(rol=>{
    if(origVB[rol] && origVB[rol].ok && (!newVB[rol] || !newVB[rol].ok)) acciones.push('Quitó VB ('+rol+')');
  });
  if(formData._obs && formData._obs !== (original && original._obs)) acciones.push('Dejó observación');
  return acciones.join(' · ') + ' en "'+etapaDef.nombre+'"';
}

async function saveModal(){
  const { projectId, procesoTipo, faseId, etapaId, formData, original } = MODAL_CTX;
  const proyecto = getProyecto(projectId);
  const proceso = getProceso(proyecto, procesoTipo);
  const etapaDef = findEtapaDef(faseId, etapaId);
  delete formData._devuelto;
  const cambio = JSON.stringify(original) !== JSON.stringify(formData);
  proceso[faseId][etapaId] = formData;
  proceso.actualizadoEn = nowISO();
  if(cambio){
    const tag = procesoTipo==='interventoria' ? ' (interventoría)' : '';
    logAccion(proyecto, describirCambioEtapa(etapaDef, original, formData) + tag);
  }
  await saveProjects();
  closeModal();
  render();
  showToast('Guardado');
}

async function devolverEtapa(){
  const motivo = prompt('Motivo de la devolución:');
  if(!motivo || !motivo.trim()) return;
  const { projectId, procesoTipo, faseId, etapaId, formData } = MODAL_CTX;
  const proyecto = getProyecto(projectId);
  const proceso = getProceso(proyecto, procesoTipo);
  const etapaDef = findEtapaDef(faseId, etapaId);
  formData._devuelto = { motivo: motivo.trim(), fecha: nowISO(), por: STATE.userName };
  proceso[faseId][etapaId] = formData;
  proceso.actualizadoEn = nowISO();
  const tag = procesoTipo==='interventoria' ? ' (interventoría)' : '';
  logAccion(proyecto, 'Devolvió "'+etapaDef.nombre+'" — motivo: '+motivo.trim() + tag);
  await saveProjects();
  closeModal();
  render();
  showToast('Etapa devuelta');
}

/* ----------------------------------------------------------
   Init
---------------------------------------------------------- */
async function init(){
  // 1. Cargar datos locales inmediatamente — mostrar login sin esperar Drive
  SCRIPT_URL = loGet('script_url') || '';
  try{ STATE.pwdOverrides = JSON.parse(loGet('pwdOverrides')||'{}'); }catch(e){ STATE.pwdOverrides={}; }
  STATE.role = loGet('role') || null;
  STATE.userName = loGet('userName') || '';
  STATE.currentUsuario = loGet('currentUsuario') || '';

  const cached = shGet('sigInfraData');
  if(cached){
    try{
      const d=JSON.parse(cached);
      STATE.projects=d.projects||[];
      STATE.actividad=d.actividad||[];
      STATE.projects.forEach(p=>{ if(!p.historial) p.historial=[]; });
    }catch(e){ STATE.projects=semillaProyectos(); STATE.actividad=[]; }
  } else {
    STATE.projects=semillaProyectos();
    STATE.actividad=[];
  }

  // 2. Mostrar la app de inmediato (login o herramienta)
  render();

  // 3. Intentar Drive en segundo plano sin bloquear
  if(SCRIPT_URL){
    try{
      const controller=new AbortController();
      setTimeout(()=>controller.abort(),8000);
      const res=await fetch(SCRIPT_URL+'?tool='+TOOL_ID,{redirect:'follow',signal:controller.signal});
      if(res.ok){
        const data=await res.json();
        if(data.projects&&data.projects.length>0){
          STATE.projects=data.projects;
          STATE.actividad=data.actividad||[];
          STATE.projects.forEach(p=>{ if(!p.historial) p.historial=[]; });
          shSet('sigInfraData',JSON.stringify(data));
          STATE.remoteOk=true;
          render(); // re-renderizar con datos de Drive
          showToast('🟢 Datos sincronizados con Drive');
        }
      }
    }catch(e){
      STATE.remoteOk=false;
    }
  }
}
init();
