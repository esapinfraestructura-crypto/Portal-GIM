<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SIG-INFRA — Control de Proyectos · GIM ESAP</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
/* ══ TOKENS ══ */
:root {
  --navy:#13294b; --navy2:#1a3760; --cyan:#0e7490; --cyan2:#0891b2;
  --green:#059669; --green2:#10b981; --amber:#d97706; --amber2:#f59e0b;
  --red:#dc2626; --red2:#ef4444; --purple:#7c3aed; --purple2:#8b5cf6;
  --indigo:#4338ca; --pink:#db2777;
  --card:#ffffff; --bg:#f0f4f8; --surface:#f8fafc;
  --border:#e2e8f0; --border2:#cbd5e1;
  --ink:#0f172a; --ink2:#1e293b; --muted:#64748b; --muted2:#94a3b8;
  --sans:'Segoe UI','Inter',system-ui,sans-serif;
  --mono:'Cascadia Code','Fira Code',monospace;
  --sidebar-w:260px; --sidebar-collapsed:64px;
  --radius:10px; --radius-lg:14px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 16px rgba(0,0,0,.1);
  --shadow-lg:0 10px 40px rgba(0,0,0,.14);
  --transition:.18s cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"] {
  --card:#1e293b; --bg:#0f172a; --surface:#1e293b;
  --border:#334155; --border2:#475569;
  --ink:#f1f5f9; --ink2:#e2e8f0; --muted:#94a3b8; --muted2:#64748b;
  --shadow:0 1px 3px rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.2);
  --shadow-md:0 4px 16px rgba(0,0,0,.35);
}

/* ══ RESET ══ */
*{box-sizing:border-box;margin:0;padding:0;}
html{font-size:14px;height:100%;overflow:hidden;}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);height:100%;overflow:hidden;transition:background var(--transition),color var(--transition);}
button,input,select,textarea{font-family:inherit;}
button{cursor:pointer;border:none;background:none;}
a{text-decoration:none;color:inherit;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}

/* ══ LOGIN ══ */
#loginScreen {
  position:fixed;inset:0;z-index:1000;display:flex;
  background:linear-gradient(135deg,#0a1929 0%,#13294b 40%,#0e4c6e 100%);
  align-items:center;justify-content:center;
}
#loginScreen::before {
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 20% 50%,rgba(14,116,144,.2) 0%,transparent 60%),
             radial-gradient(ellipse at 80% 20%,rgba(124,58,237,.15) 0%,transparent 50%);
}
.login-card {
  position:relative;z-index:1;
  background:rgba(255,255,255,.04);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.1);
  border-radius:20px;padding:40px 36px;
  width:min(420px,95vw);
  box-shadow:0 32px 80px rgba(0,0,0,.5);
  animation:slideUp .4s ease;
}
@keyframes slideUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
.login-logo{text-align:center;margin-bottom:28px;}
.login-logo img{width:80px;height:80px;border-radius:50%;border:3px solid rgba(255,255,255,.2);box-shadow:0 0 40px rgba(14,116,144,.4);}
.login-title{color:#fff;font-size:22px;font-weight:700;margin-top:14px;}
.login-sub{color:rgba(255,255,255,.5);font-size:12.5px;margin-top:4px;}
.login-field{margin-bottom:16px;}
.login-field label{display:block;color:rgba(255,255,255,.7);font-size:12px;font-weight:600;margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase;}
.login-field input{
  width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);
  color:#fff;border-radius:8px;padding:11px 14px;font-size:14px;
  transition:border-color var(--transition),background var(--transition);
}
.login-field input::placeholder{color:rgba(255,255,255,.3);}
.login-field input:focus{outline:none;border-color:rgba(14,116,144,.7);background:rgba(255,255,255,.1);}
.login-btn{
  width:100%;background:linear-gradient(135deg,var(--cyan) 0%,var(--cyan2) 100%);
  color:#fff;border-radius:8px;padding:12px;font-size:14px;font-weight:700;
  margin-top:8px;transition:all var(--transition);letter-spacing:.02em;
  box-shadow:0 4px 16px rgba(14,116,144,.4);
}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(14,116,144,.5);}
.login-btn:active{transform:translateY(0);}
.login-btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.login-err{background:rgba(220,38,38,.15);border:1px solid rgba(220,38,38,.3);color:#fca5a5;border-radius:8px;padding:10px 12px;font-size:12.5px;margin-bottom:14px;display:none;}
.login-lock{background:rgba(217,119,6,.15);border:1px solid rgba(217,119,6,.3);color:#fcd34d;border-radius:8px;padding:12px;font-size:12.5px;margin-bottom:14px;display:none;text-align:center;}

/* ══ APP SHELL ══ */
#appShell{display:none;height:100vh;overflow:hidden;position:fixed;inset:0;}
.shell{display:flex;height:100vh;}

/* ══ SIDEBAR ══ */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  background:var(--navy);color:#fff;
  display:flex;flex-direction:column;
  transition:width var(--transition);
  position:relative;z-index:30;
  box-shadow:2px 0 20px rgba(0,0,0,.2);
}
.sidebar.collapsed{width:var(--sidebar-collapsed);}
.sidebar-header{padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:12px;min-height:72px;}
.sidebar-logo img{width:38px;height:38px;border-radius:10px;object-fit:cover;flex-shrink:0;}
.sidebar-brand{overflow:hidden;white-space:nowrap;}
.sidebar-brand .name{font-weight:800;font-size:15px;letter-spacing:-.01em;}
.sidebar-brand .sub{font-size:10px;color:rgba(255,255,255,.4);margin-top:2px;font-family:var(--mono);}
.sidebar.collapsed .sidebar-brand{display:none;}
.sidebar-toggle{margin-left:auto;flex-shrink:0;color:rgba(255,255,255,.4);padding:4px;border-radius:6px;transition:color var(--transition),background var(--transition);}
.sidebar-toggle:hover{color:#fff;background:rgba(255,255,255,.1);}
.sidebar.collapsed .sidebar-toggle{margin:0;}
.sidebar-nav{flex:1;overflow-y:auto;padding:12px 10px;}
.nav-group{margin-bottom:24px;}
.nav-group-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.3);padding:0 8px;margin-bottom:6px;overflow:hidden;white-space:nowrap;}
.sidebar.collapsed .nav-group-label{visibility:hidden;}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:9px 10px;border-radius:8px;cursor:pointer;
  color:rgba(255,255,255,.55);font-size:13.5px;font-weight:500;
  transition:all var(--transition);white-space:nowrap;
  position:relative;
}
.nav-item:hover{color:#fff;background:rgba(255,255,255,.08);}
.nav-item.active{color:#fff;background:rgba(14,116,144,.35);}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:60%;background:var(--cyan2);border-radius:0 3px 3px 0;}
.nav-icon{font-size:17px;flex-shrink:0;width:22px;text-align:center;}
.nav-label{overflow:hidden;}
.sidebar.collapsed .nav-label{display:none;}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;}
.sidebar.collapsed .nav-badge{display:none;}
.sidebar-footer{padding:14px 10px;border-top:1px solid rgba(255,255,255,.08);}
.user-mini{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:8px;cursor:pointer;transition:background var(--transition);}
.user-mini:hover{background:rgba(255,255,255,.08);}
.user-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;}
.user-info{overflow:hidden;}
.user-info .uname{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-info .urole{font-size:10.5px;color:rgba(255,255,255,.4);}
.sidebar.collapsed .user-info{display:none;}
.drive-status{display:flex;align-items:center;gap:6px;font-size:11px;padding:6px 8px;border-radius:6px;margin-bottom:8px;cursor:pointer;transition:background var(--transition);}
.drive-status:hover{background:rgba(255,255,255,.08);}
.drive-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.sidebar.collapsed .drive-status span{display:none;}

/* ══ MAIN CONTENT ══ */
.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{
  background:var(--card);border-bottom:1px solid var(--border);
  padding:0 24px;height:56px;display:flex;align-items:center;gap:12px;
  flex-shrink:0;box-shadow:var(--shadow);
}
.topbar-title{font-weight:700;font-size:16px;flex:1;}
.topbar-actions{display:flex;align-items:center;gap:8px;}
.icon-btn{
  width:36px;height:36px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-size:17px;color:var(--muted);
  transition:all var(--transition);
}
.icon-btn:hover{background:var(--surface);color:var(--ink);}
.content-area{flex:1;overflow-y:auto;overflow-x:hidden;padding:24px;-webkit-overflow-scrolling:touch;}
.page{display:none;animation:fadeIn .2s ease;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ══ KPI CARDS ══ */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:20px;}
.kpi-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:18px 20px;position:relative;overflow:hidden;
  transition:all var(--transition);cursor:default;
}
.kpi-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
.kpi-card::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--kc,var(--cyan));border-radius:var(--radius-lg) var(--radius-lg) 0 0;}
.kpi-icon{font-size:22px;margin-bottom:10px;}
.kpi-val{font-size:28px;font-weight:800;color:var(--kc,var(--cyan));font-family:var(--mono);line-height:1;}
.kpi-label{font-size:12px;color:var(--muted);margin-top:4px;font-weight:600;}
.kpi-trend{display:flex;align-items:center;gap:4px;margin-top:8px;font-size:11.5px;}
.trend-up{color:var(--green2);}
.trend-down{color:var(--red2);}
.trend-neutral{color:var(--muted);}

/* ══ CARDS ══ */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);}
.card-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;}
.card-head h3{font-size:13.5px;font-weight:700;color:var(--ink2);}
.card-head .card-sub{font-size:11.5px;color:var(--muted);}
.card-body{padding:20px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}

/* ══ CHARTS ══ */
.chart-wrap{position:relative;height:220px;}
.chart-wrap.tall{height:280px;}

/* ══ PROGRESS ══ */
.prog-row{margin-bottom:12px;}
.prog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
.prog-name{font-size:12.5px;font-weight:600;color:var(--ink2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:75%;}
.prog-pct{font-family:var(--mono);font-size:12px;font-weight:700;}
.prog-bar{height:8px;background:var(--surface);border-radius:4px;overflow:hidden;}
.prog-fill{height:100%;border-radius:4px;transition:width .6s cubic-bezier(.4,0,.2,1);}
.prog-sub{font-size:10.5px;color:var(--muted);margin-top:3px;}

/* ══ PROJECT CARDS ══ */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
.proj-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);
  overflow:hidden;cursor:pointer;transition:all var(--transition);
}
.proj-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:var(--border2);}
.pc-header{padding:14px 16px 10px;border-bottom:1px solid var(--border);}
.pc-sede{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px;}
.pc-title{font-weight:700;font-size:14px;color:var(--ink);line-height:1.35;margin-bottom:8px;}
.pc-tipo{font-size:11.5px;color:var(--muted);}
.pc-body{padding:12px 16px;}
.fase-chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;margin-bottom:10px;}
.fase-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.pc-footer{padding:10px 16px;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.pc-cdp{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--green);}
.secop-link{font-size:11px;font-weight:700;color:var(--cyan);display:flex;align-items:center;gap:4px;}
.secop-link:hover{text-decoration:underline;}
.pc-team{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;}
.team-chip{font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:3px;}

/* ══ SEMÁFOROS ══ */
.sem{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;}
.sem-verde{background:#d1fae5;color:#065f46;}
.sem-amarillo{background:#fef3c7;color:#92400e;}
.sem-rojo{background:#fee2e2;color:#991b1b;}
.sem-azul{background:#dbeafe;color:#1e40af;}
.sem-gris{background:var(--surface);color:var(--muted);}
[data-theme="dark"] .sem-verde{background:#064e3b;color:#6ee7b7;}
[data-theme="dark"] .sem-amarillo{background:#78350f;color:#fde68a;}
[data-theme="dark"] .sem-rojo{background:#7f1d1d;color:#fca5a5;}
[data-theme="dark"] .sem-azul{background:#1e3a5f;color:#93c5fd;}

/* ══ TABLA ══ */
.table-wrap{overflow-x:auto;}
table.tbl{width:100%;border-collapse:collapse;}
table.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface);padding:10px 14px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;font-weight:700;}
table.tbl td{padding:11px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;}
table.tbl tr:last-child td{border-bottom:none;}
table.tbl tr:hover td{background:var(--surface);}
.tbl-name{font-weight:600;color:var(--ink);}

/* ══ BUTTONS ══ */
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;transition:all var(--transition);border:1px solid var(--border);background:var(--card);color:var(--ink);}
.btn:hover{filter:brightness(.97);}
.btn-primary{background:var(--cyan);border-color:var(--cyan);color:#fff;box-shadow:0 2px 8px rgba(14,116,144,.3);}
.btn-primary:hover{background:var(--cyan2);box-shadow:0 4px 16px rgba(14,116,144,.4);}
.btn-danger{color:var(--red);border-color:var(--red2);}
.btn-danger:hover{background:var(--red);color:#fff;}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted);}
.btn-ghost:hover{background:var(--surface);color:var(--ink);}
.btn-sm{padding:5px 10px;font-size:12px;gap:4px;}
.btn-xs{padding:3px 8px;font-size:11px;gap:3px;}

/* ══ FORMS ══ */
.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
.field input,.field select,.field textarea{
  width:100%;border:1px solid var(--border);border-radius:8px;
  padding:9px 12px;font-size:13.5px;background:var(--card);color:var(--ink);
  transition:border-color var(--transition),box-shadow var(--transition);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(14,116,144,.12);}
.field textarea{resize:vertical;min-height:72px;}
.form-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.section-sep{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.toggle-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.toggle-row label{font-weight:600;font-size:13px;cursor:pointer;}
.toggle-row input[type=checkbox]{width:auto;accent-color:var(--cyan);}

/* ══ MODAL ══ */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:500;}
.overlay.show{display:flex;}
.modal{background:var(--card);border-radius:14px;max-width:680px;width:100%;box-shadow:var(--shadow-lg);animation:slideUp .2s ease;display:flex;flex-direction:column;max-height:calc(100vh - 40px);}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{font-size:16px;font-weight:700;}
.modal-close{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--muted);transition:all var(--transition);}
.modal-close:hover{background:var(--surface);color:var(--ink);}
.modal-body{padding:20px 22px;overflow-y:auto;flex:1;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}

/* ══ AUDIT LOG ══ */
.audit-item{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start;transition:background var(--transition);}
.audit-item:hover{background:var(--surface);}
.audit-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;}
.audit-content{flex:1;min-width:0;}
.audit-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:3px;gap:8px;}
.audit-who{font-weight:600;font-size:13px;}
.audit-ts{font-size:10.5px;color:var(--muted);font-family:var(--mono);white-space:nowrap;}
.audit-action{font-size:12.5px;color:var(--muted);}
.audit-meta{display:flex;gap:10px;margin-top:5px;flex-wrap:wrap;}
.audit-tag{font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:3px;}

/* ══ USER MANAGEMENT ══ */
.user-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);transition:background var(--transition);}
.user-row:hover{background:var(--surface);}
.u-avatar{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0;}
.u-info{flex:1;min-width:0;}
.u-name{font-weight:600;font-size:13.5px;}
.u-meta{font-size:11.5px;color:var(--muted);font-family:var(--mono);}
.u-actions{display:flex;gap:4px;align-items:center;}
.role-chip{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;}
.inactive-dim{opacity:.5;}
.perms-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.perm-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all var(--transition);}
.perm-item:hover{background:var(--surface);}
.perm-item input[type=checkbox]{width:auto;accent-color:var(--cyan);}
.perm-label{font-size:12.5px;font-weight:600;}
.perm-desc{font-size:11px;color:var(--muted);}

/* ══ TOOLBAR ══ */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
.search-box{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:7px 12px;min-width:220px;}
.search-box input{border:none;background:none;color:var(--ink);font-size:13px;outline:none;flex:1;}
.search-box input::placeholder{color:var(--muted);}

/* ══ TABS (inline) ══ */
.tab-bar{display:flex;gap:0;background:var(--surface);border-radius:8px;padding:3px;margin-bottom:18px;}
.tab-btn{flex:1;padding:7px 14px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--muted);transition:all var(--transition);text-align:center;}
.tab-btn.active{background:var(--card);color:var(--ink);box-shadow:var(--shadow);}

/* ══ INACTIVITY / ALERTS ══ */
#inactivityBar{display:none;position:fixed;top:0;left:0;right:0;z-index:999;background:var(--amber);color:#fff;padding:8px 20px;font-size:13px;font-weight:600;text-align:center;}
#toast{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.toast-item{background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);animation:toastIn .2s ease;max-width:320px;}
@keyframes toastIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}
.toast-success{background:#065f46;}
.toast-error{background:#991b1b;}
.toast-warn{background:#92400e;}

/* ══ EMPTY ══ */
.empty-state{text-align:center;padding:48px 24px;color:var(--muted);}
.empty-icon{font-size:40px;margin-bottom:12px;}
.empty-title{font-size:16px;font-weight:700;color:var(--ink2);margin-bottom:6px;}
.empty-sub{font-size:13px;}

/* ══ SCROLLBAR SECTION ══ */
.scroll-y{overflow-y:auto;max-height:420px;}

/* ══ RESPONSIVE ══ */
@media(max-width:900px){
  .sidebar{position:fixed;top:0;bottom:0;left:0;z-index:50;transform:translateX(0);}
  .sidebar.collapsed{transform:translateX(calc(-1*(var(--sidebar-w) - var(--sidebar-collapsed))));}
  .grid-2,.grid-3,.form-2,.perms-grid{grid-template-columns:1fr;}
  .kpi-row{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>

<!-- ══ INACTIVITY BAR ══ -->
<div id="inactivityBar">⚠️ Tu sesión cerrará en <span id="inactCountdown">5:00</span> por inactividad. <button onclick="resetInactivity()" style="margin-left:12px;background:rgba(255,255,255,.25);border:none;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:700;color:#fff;cursor:pointer;">Mantener activa</button></div>

<!-- ══ LOGIN ══ -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">
      <img id="loginLogo" src="" alt="ESAP">
      <div class="login-title">SIG-INFRA</div>
      <div class="login-sub">Sistema de Control de Proyectos · GIM ESAP</div>
    </div>
    <div class="login-lock" id="lockMsg"></div>
    <div class="login-err" id="loginErr"></div>
    <div class="login-field"><label>Usuario</label><input id="lUser" type="text" placeholder="primernombre.apellido" autocomplete="username"></div>
    <div class="login-field"><label>Contraseña</label><input id="lPass" type="password" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="login-btn" id="lBtn">Ingresar al Sistema</button>
    <div style="text-align:center;margin-top:16px;"><div id="lAttempts" style="font-size:11px;color:rgba(255,255,255,.3);"></div></div>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="appShell">
  <div class="shell">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo"><img id="sidebarLogo" src="" alt="GIM"></div>
        <div class="sidebar-brand">
          <div class="name">SIG-INFRA</div>
          <div class="sub">GIM · ESAP</div>
        </div>
        <button class="sidebar-toggle" id="sidebarToggle">☰</button>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-group">
          <div class="nav-group-label">Principal</div>
          <div class="nav-item active" data-page="dashboard">
            <span class="nav-icon">📊</span><span class="nav-label">Dashboard</span>
          </div>
          <div class="nav-item" data-page="proyectos">
            <span class="nav-icon">🏗️</span><span class="nav-label">Proyectos</span>
          </div>
        </div>
        <div class="nav-group" id="navAdminGroup" style="display:none;">
          <div class="nav-group-label">Administración</div>
          <div class="nav-item" data-page="usuarios" id="navUsuarios">
            <span class="nav-icon">👥</span><span class="nav-label">Usuarios</span>
          </div>
          <div class="nav-item" data-page="auditoria" id="navAuditoria">
            <span class="nav-icon">🔍</span><span class="nav-label">Auditoría</span>
            <span class="nav-badge" id="auditBadge" style="display:none;">!</span>
          </div>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="drive-status" id="driveStatus" onclick="openDriveModal()">
          <div class="drive-dot" id="driveDot" style="background:#6b7280;"></div>
          <span id="driveLabel" style="font-size:11.5px;color:rgba(255,255,255,.5);">Sin Drive</span>
        </div>
        <div class="user-mini" onclick="openPwdModal()">
          <div class="user-avatar" id="sidebarAvatar" style="background:#1e3a5f;color:#93c5fd;"></div>
          <div class="user-info">
            <div class="uname" id="sidebarName"></div>
            <div class="urole" id="sidebarRole"></div>
          </div>
        </div>
        <div style="display:flex;gap:8px;margin-top:8px;">
          <button class="nav-item" style="flex:1;justify-content:center;" onclick="toggleTheme()"><span class="nav-icon" id="themeIcon">🌙</span><span class="nav-label">Modo oscuro</span></button>
          <button class="nav-item" style="justify-content:center;min-width:40px;" onclick="doLogout()"><span class="nav-icon">🚪</span></button>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <div class="main-area">
      <div class="topbar">
        <div class="topbar-title" id="topbarTitle">Dashboard</div>
        <div class="topbar-actions">
          <button class="icon-btn" title="Actualizar" onclick="refreshData()">🔄</button>
          <button class="icon-btn" title="Notificaciones">🔔</button>
          <button class="icon-btn btn-primary" id="btnNuevoProyecto" style="display:none;padding:6px 14px;font-size:12.5px;font-weight:700;border-radius:8px;gap:5px;" onclick="openProjModal(null)">+ Nuevo</button>
        </div>
      </div>
      <div class="content-area">
        <div class="page" id="page-dashboard" style="display:block;"></div>
        <div class="page" id="page-proyectos" style="display:none;"></div>
        <div class="page" id="page-usuarios" style="display:none;"></div>
        <div class="page" id="page-auditoria" style="display:none;"></div>
        <div class="page" id="page-equipos" style="display:none;"></div>
        <div class="page" id="page-reportes" style="display:none;"></div>
      </div>
    </div>
  </div>
</div>

<!-- Toast container -->
<div id="toast"></div>

// ══ CRYPTO ══
async function sha256(str){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function hashPwd(p){return await sha256(p+'::GIM-ESAP-SALT-2026');}

// ══ DEVICE INFO ══
function getDeviceInfo(){
  const ua=navigator.userAgent;
  let browser='Desconocido';
  if(ua.includes('Chrome'))browser='Chrome';
  else if(ua.includes('Firefox'))browser='Firefox';
  else if(ua.includes('Safari'))browser='Safari';
  else if(ua.includes('Edge'))browser='Edge';
  let device='Desktop';
  if(/Mobi|Android/i.test(ua))device='Móvil';
  else if(/iPad|Tablet/i.test(ua))device='Tablet';
  const os=ua.includes('Windows')?'Windows':ua.includes('Mac')?'macOS':ua.includes('Linux')?'Linux':ua.includes('Android')?'Android':ua.includes('iOS')?'iOS':'Desconocido';
  return{browser,device,os};
}

async function getIP(){
  try{const r=await fetch('https://api.ipify.org?format=json',{signal:AbortSignal.timeout(2000)});const d=await r.json();return d.ip||'N/D';}catch(e){return 'N/D';}
}

function logAudit(accion,detalle,tipo='accion'){
  const dev=getDeviceInfo();
  const entry={
    id:uid(),fecha:nowISO(),
    usuario:SES?.usuario||'?',nombre:SES?.nombre||'?',rol:SES?.rol||'?',
    accion,detalle:detalle||'',tipo,
    ip:'N/D',browser:dev.browser,device:dev.device,os:dev.os,
    modulo:PAGE
  };
  AUDIT.unshift(entry);
  if(AUDIT.length>1000)AUDIT.length=1000;
  // Get IP async without blocking
  getIP().then(ip=>{entry.ip=ip;save();}).catch(()=>{});
  save();
}

function save(){
  const ts=Date.now();
  try {
    localStorage.setItem(DK,JSON.stringify(PROJ));
    localStorage.setItem(AK,JSON.stringify(USERS));
    localStorage.setItem('sig_audit',JSON.stringify(AUDIT));
    localStorage.setItem('sig_ts',String(ts));
  } catch(e) {
    toast('⚠️ Error al guardar: '+e.message,'error');
    return;
  }
  // Update UI indicator
  var el=document.getElementById('lastSavedAt');
  if(el)el.textContent='✅ '+new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
  const allData={projects:PROJ,users:USERS,audit:AUDIT,lastSaved:nowISO(),ts:ts};
  if(SCRIPT_URL){
    remoteSave(allData).then(function(){
      // Update last-saved indicator
      const el=document.getElementById('lastSavedAt');
      if(el)el.textContent='Guardado '+new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
    }).catch(function(){
      // Local already saved - Drive failed silently
    });
  } else {
    clearTimeout(window._driveWarn);
    window._driveWarn=setTimeout(function(){
      if(!SCRIPT_URL)toast('⚠️ Datos guardados localmente. Sin Drive conectado.','warn');
    },500);
  }
}

async function doLogin(){
  const u=document.getElementById('lUser').value.trim().toLowerCase();
  const p=document.getElementById('lPass').value;
  const errEl=document.getElementById('loginErr');
  const lockEl=document.getElementById('lockMsg');
  const btn=document.getElementById('lBtn');

  // Check lock
  const lock=getLock();
  if(lock){
    const min=Math.ceil((lock-Date.now())/60000);
    lockEl.textContent=`Cuenta bloqueada temporalmente. Intenta en ${min} min.`;
    lockEl.style.display='block';
    return;
  }

  if(!u||!p){errEl.textContent='Completa usuario y contraseña.';errEl.style.display='block';return;}
  btn.disabled=true;btn.textContent='Verificando...';

  const entry=USERS.find(d=>d.usuario.toLowerCase()===u);
  if(!entry||entry.activo===false){
    errEl.textContent='Usuario no encontrado o desactivado.';errEl.style.display='block';
    btn.disabled=false;btn.textContent='Ingresar al Sistema';return;
  }

  const hash=await hashPwd(p);
  const storedHash=pwdHash[entry.id]||(await hashPwd(entry.cedula));
  if(hash!==storedHash){
    // Track attempts
    const att=getAttempts();
    att[u]=(att[u]||0)+1;
    localStorage.setItem(ATTEMPTS_KEY,JSON.stringify(att));
    const remaining=5-att[u];
    if(remaining<=0){setLock();clearAttempts();lockEl.textContent='Demasiados intentos. Cuenta bloqueada 15 minutos.';lockEl.style.display='block';errEl.style.display='none';}
    else{errEl.textContent=`Contraseña incorrecta. ${remaining} intentos restantes.`;errEl.style.display='block';}
    logAuditAnon(u,'Intento de acceso fallido','fallo');
    btn.disabled=false;btn.textContent='Ingresar al Sistema';return;
  }

  clearAttempts();
  SES=entry;
  sessionStart=Date.now();
  sessionStorage.setItem(SESSION_KEY,JSON.stringify({id:entry.id,u:entry.usuario,r:entry.rol,n:entry.nombre,t:sessionStart}));
  logAudit('Inicio de sesión','','login');
  errEl.style.display='none';

function logAuditAnon(usuario,accion,tipo){
  const dev=getDeviceInfo();
  const entry={id:uid(),fecha:nowISO(),usuario,nombre:'N/D',rol:'N/D',accion,detalle:'',tipo,ip:'N/D',browser:dev.browser,device:dev.device,os:dev.os,modulo:'login'};
  AUDIT.unshift(entry);
  if(AUDIT.length>1000)AUDIT.length=1000;
  getIP().then(ip=>{entry.ip=ip;localStorage.setItem('sig_audit',JSON.stringify(AUDIT));}).catch(()=>{});
  localStorage.setItem('sig_audit',JSON.stringify(AUDIT));
}

function doLogout(){

  save();
  SES=null;sessionStorage.removeItem(SESSION_KEY);

// Ctrl+S shortcut to save open modal
document.addEventListener('keydown',function(e){

    e.preventDefault();

function startInactivity(){
  clearInactivity();
  inactWarnTimer=setTimeout(()=>{
    document.getElementById('inactivityBar').style.display='block';
    startCountdown(WARN_MS/1000);
  },INACT_MS-WARN_MS);
  inactTimer=setTimeout(()=>{doLogout();},INACT_MS);
}
function startCountdown(secs){
  const el=document.getElementById('inactCountdown');
  let s=Math.round(secs);
  const iv=setInterval(()=>{
    s--;
    const m=Math.floor(s/60),sec=s%60;
    el.textContent=m+':'+(sec<10?'0':'')+sec;
    if(s<=0){clearInterval(iv);}
  },1000);
  window._countdownIv=iv;
}
function clearInactivity(){
  clearTimeout(inactTimer);clearTimeout(inactWarnTimer);clearInterval(window._countdownIv);
  document.getElementById('inactivityBar').style.display='none';
}
function resetInactivity(){clearInactivity();startInactivity();}
['click','keydown','mousemove','touchstart'].forEach(e=>document.addEventListener(e,()=>{if(SES)resetInactivity();},{passive:true}));

function startApp(){
  SCRIPT_URL=localStorage.getItem(SK)||'https://script.google.com/macros/s/AKfycbwWbA8BpxQmPiFQofSjHkeLcnQO_fjp1wGqkuW4fiVu8J765eLW_As8DzaWXiNQy9og/exec';
  if(!SCRIPT_URL)SCRIPT_URL='https://script.google.com/macros/s/AKfycbwWbA8BpxQmPiFQofSjHkeLcnQO_fjp1wGqkuW4fiVu8J765eLW_As8DzaWXiNQy9og/exec';
  localStorage.setItem(SK,SCRIPT_URL);
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appShell').style.display='block';
  document.getElementById('loginLogo').src=_ESAP;
  document.getElementById('sidebarLogo').src=_ANT;
  loadTheme();

  // User UI
  const initials=SES.nombre.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
  document.getElementById('sidebarAvatar').textContent=initials;
  document.getElementById('sidebarAvatar').style.background=(ROL_COLOR[SES.rol]||'#334155')+'33';
  document.getElementById('sidebarAvatar').style.color=ROL_COLOR[SES.rol]||'#93c5fd';
  document.getElementById('sidebarName').textContent=SES.nombre.split(' ').slice(0,2).join(' ');
  document.getElementById('sidebarRole').textContent=ROL_LABEL[SES.rol]||SES.rol;

  if(isAdmin()){
    document.getElementById('navAdminGroup').style.display='';
  }
  if(canEditProj()){
    document.getElementById('btnNuevoProyecto').style.display='';
  }

  updateDriveUI();
  attachNav();
  startInactivity();
  setPage('dashboard');

  // Sincronización con Drive en segundo plano
  if(SCRIPT_URL){
    remoteLoad().then(d=>{
      if(d&&d.projects&&d.projects.length){
        // Only overwrite local data if Drive is strictly newer
        var localTs=parseInt(localStorage.getItem('sig_ts')||'0');
        var driveTs=d.ts||0;
        if(driveTs>localTs){
          PROJ=d.projects;
          if(d.users&&d.users.length)USERS=d.users;
          if(d.audit&&d.audit.length)AUDIT=d.audit;
          localStorage.setItem(DK,JSON.stringify(PROJ));
          localStorage.setItem(AK,JSON.stringify(USERS));
          localStorage.setItem('sig_audit',JSON.stringify(AUDIT));
          localStorage.setItem('sig_ts',String(driveTs));
          setPage(PAGE);
          toast('☁️ Datos sincronizados desde Drive','success');
        } else {
          toast('☁️ Drive conectado — datos locales más recientes','success');
        }
      }
    }).catch(()=>{
      toast('🟡 Sin conexión a Drive — usando datos locales');
    });
  } else {
    // Recordar conectar Drive
    setTimeout(()=>{
      if(!SCRIPT_URL)toast('⚠️ Conecta Google Drive para asegurar tus datos (botón ☁️ en el sidebar)','warn');
    },3000);
  }
}

function attachNav(){
  document.querySelectorAll('.nav-item[data-page]').forEach(b=>{
    b.addEventListener('click',()=>setPage(b.dataset.page));
  });
  document.getElementById('sidebarToggle').addEventListener('click',()=>{
    document.getElementById('sidebar').classList.toggle('collapsed');
  });
}

function setPage(p){
  PAGE=p;
  document.querySelectorAll('.nav-item[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));
  document.querySelectorAll('.page').forEach(function(el){
    el.classList.remove('active');
    // Clear content of pages we're leaving to prevent ghost rendering
    if(!el.id||el.id!==('page-'+p)) el.innerHTML='';
  });
  const titles={dashboard:'Dashboard Ejecutivo',proyectos:'Control de Proyectos',usuarios:'Gestión de Usuarios',auditoria:'Auditoría del Sistema'};
  document.getElementById('topbarTitle').textContent=titles[p]||p;
  Object.values(charts).forEach(c=>{try{c.destroy();}catch(e){}});charts={};
  // Clear non-active pages to prevent escaped HTML contamination
  // Explicitly hide ALL pages using inline style (beats any CSS)
  document.querySelectorAll('.page').forEach(function(el){
    el.style.display='none';
    el.classList.remove('active');
  });
  // Show only the target page
  var pg=document.getElementById('page-'+p);
  if(pg){ pg.style.display='block'; pg.classList.add('active'); }
  document.getElementById('btnNuevoProyecto').style.display=(p==='proyectos'&&canEditProj())?'':'none';

  if(p==='dashboard')renderDashboard();
  else if(p==='proyectos'){
    if(SES?.permisos?.proyectos!==false||isAdmin())renderProyectos();
    else{toast('Sin acceso a proyectos','error');setPage('dashboard');}
  }
  else if(p==='usuarios'){if(isAdmin())renderUsuarios();else{toast('Solo el administrador puede ver usuarios','error');setPage('dashboard');}}
  else if(p==='auditoria'){if(isAdmin())renderAuditoria();else{toast('Solo el administrador puede ver auditoría','error');setPage('dashboard');}}
  else if(p==='equipos'){if(isAdmin())renderEquipos();else{toast('Sin acceso','error');setPage('dashboard');}}
  else if(p==='reportes')renderReportes();
  logAudit('Accedió al módulo: '+titles[p],'');
}

  mc.innerHTML=`
  <div class="toolbar">
    <div class="search-box">
      <span>🔍</span>
      <input id="pSearch" placeholder="Buscar proyecto..." value="${esc(search)}">
    </div>
    <select id="pFase" class="btn btn-sm" style="font-size:12.5px;">
      <option value="">Todas las fases</option>
      ${Object.entries(FASES).map(([k,v])=>`<option value="${k}" ${ff===k?'selected':''}>${v.label}</option>`).join('')}
    </select>
    <select id="pSede" class="btn btn-sm" style="font-size:12.5px;">
      <option value="">Todas las sedes</option>
      ${sedes.map(s=>`<option value="${s}" ${fs===s?'selected':''}>${s}</option>`).join('')}
    </select>
    <span style="margin-left:auto;font-size:12.5px;color:var(--muted);">${P.length} proyecto${P.length!==1?'s':''}</span>
  </div>
  ${sedes.map(sede=>{
    const ps=P.filter(p=>p.sede===sede);
    if(!ps.length&&fs&&fs!==sede)return '';
    return `<div style="margin-bottom:24px;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
        <div style="width:4px;height:20px;background:var(--cyan);border-radius:2px;"></div>
        <h3 style="font-size:14px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;">📍 ${sede}</h3>
        <span style="background:var(--navy);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;">${ps.length}</span>
      </div>
      <div class="proj-grid">${ps.map(projCard).join('')}</div>
    </div>`;
  }).join('')}
  ${!P.length?'<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">Sin resultados</div><div class="empty-sub">Cambia los filtros para ver proyectos.</div></div>':''}`;

  mc.querySelectorAll('.proj-card').forEach(c=>c.addEventListener('click',()=>openProjModal(c.dataset.id)));
  document.getElementById('pSearch')?.addEventListener('input',e=>{window._pSearch=e.target.value;renderProyectos();});
  document.getElementById('pFase')?.addEventListener('change',e=>{window._pFase=e.target.value;renderProyectos();});
  document.getElementById('pSede')?.addEventListener('change',e=>{window._pSede=e.target.value;renderProyectos();});
}

    <div class="pc-header">

      </div>
      <div class="prog-row">
        <div class="prog-top">

const TEAM_KEY='sig_teams';
function getTeams(){
  try{const d=localStorage.getItem(TEAM_KEY);return d?JSON.parse(d):null;}catch(e){return null;}
}
function saveTeams(t){localStorage.setItem(TEAM_KEY,JSON.stringify(t));}
function getTeamList(rol){
  try{
    const raw=localStorage.getItem('sig_team_'+rol);
    if(raw){const arr=JSON.parse(raw);if(arr&&arr.length>0)return arr;}
  }catch(e){}
  // Defaults
  if(rol==='supervisores') return USERS.filter(u=>u.activo&&(u.esSupervisor||u.usuario==='walter.isaza'||u.usuario==='ivan.cespedes')).map(u=>u.nombre).filter(Boolean).concat(['Walter David Isaza Avilés','Iván David Céspedes Roa']).filter((v,i,a)=>a.indexOf(v)===i);
  return USERS.filter(u=>u.activo&&u.rol===rol).map(u=>u.nombre);
}
function saveTeamList(rol,arr){localStorage.setItem('sig_team_'+rol,JSON.stringify(arr));}
function ensureTeams(){
  return {
    tecnico:getTeamList('tecnico'),
    juridico:getTeamList('juridico'),
    financiero:getTeamList('financiero'),
    supervisores:getTeamList('supervisores')
  };
}


function openProjModal(id){

      avance:0,adjudicado:false,secop:'',equipoActual:'tecnico',
      supervisor:'',apoyoSupervision:'',tecnico:'',juridico:'',financiero:'',contratista:'',
      adiciones:[],adicion:false,valorAdicion:0,descAdicion:'',
      avanceContractual:0,avancePoscontractual:0,pagado:0,actasPago:0,retencion:0,

    if(!f.pagos||!Array.isArray(f.pagos))f.pagos=[];
    while(f.pagos.length<10)f.pagos.push({fecha:'',desc:'',valor:0,avanceObra:0});
    // Migrate old fase field
    if(f.fase&&FASES[f.fase]){
      const g=getFaseGrupo(f.fase);
      if(g==='pre'){f.fasePrec=f.fase;if(!['pre','cont','pos'].includes(f.fase))f.fase='pre';}
      else if(g==='cont'){f.faseCont=f.fase;f.fase='cont';}

    if(!['pre','cont','pos'].includes(f.fase))f.fase='pre';

    const dis=canEditProj()?'':'disabled';

        +'<div style="display:flex;gap:8px;">'

          +'<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>'
          +(canEditProj()?'<button class="btn btn-primary" id="mSave">Guardar</button>':'')
        +'</div>'
      +'</div>';

    document.getElementById('modal').innerHTML=html;
    openModal();
    document.getElementById('mSave')?.addEventListener('click',()=>saveProj(f,isNew));
    document.getElementById('mDel')?.addEventListener('click',()=>delProj(f.id));
    document.getElementById('btnInfProj')?.addEventListener('click',()=>exportProyecto(f.id));
    ['mAvance','mAvC','mAvP'].forEach(id=>{
      document.getElementById(id)?.addEventListener('input',updateStages);
    });
    recalcPos();
  }catch(err){
    console.error('openProjModal error:',err);
    document.getElementById('modal').innerHTML='<div class="modal-head"><h3>Error</h3><button class="modal-close" onclick="closeModal()">X</button></div><div class="modal-body"><p style="color:red;padding:20px;">'+err.message+'</p></div>';
    openModal();
  }
}

function switchBloque(v){
  ['pre','cont','pos'].forEach(b=>{
    const blk=document.getElementById('bloque_'+b);
    const btn=document.getElementById('blk_'+b);
    if(blk)blk.style.display=v===b?'':'none';
    if(btn){
      const c=b==='pre'?'#6366f1':b==='cont'?'#0284c7':'#059669';
      btn.style.borderColor=v===b?c:'var(--border)';
      btn.style.background=v===b?c+'0d':'var(--surface)';
      btn.querySelectorAll('div').forEach(d=>d.style.color=v===b?c:'var(--muted)');
    }
  });
  const inp=document.getElementById('mFaseBloque');
  if(inp)inp.value=v;
}

function toggleAdicion(){
  const chk=document.getElementById('mAdicion');
  const fields=document.getElementById('adicionFields');
  if(fields)fields.style.display=chk?.checked?'':'none';
}

function toggleAdicionRow(i){
  const tipo=document.getElementById('adTipo'+i)?.value||'';
  const showVal=tipo&&tipo!=='Prorrog de tiempo';
  const showDias=tipo&&tipo!=='Adicion de dinero';
  const vc=document.getElementById('adValCell'+i);
  const dc=document.getElementById('adDiasCell'+i);
  if(vc)vc.style.display=showVal?'':'none';
  if(dc)dc.style.display=showDias?'':'none';
  // Recalc adicion resumen
  let totalVal=0,totalDias=0,count=0;
  for(let j=0;j<20;j++){
    const t=document.getElementById('adTipo'+j)?.value||'';
    if(!t)continue;count++;
    totalVal+=parseFloat(document.getElementById('adValor'+j)?.value)||0;
    totalDias+=parseInt(document.getElementById('adDias'+j)?.value)||0;
  }
  const res=document.getElementById('adicionResumen');
  if(res&&count>0){
    res.innerHTML='<strong>'+count+' adicion(es):</strong>'
      +(totalVal>0?' Valor total adicional: <strong>$'+totalVal.toLocaleString('es-CO')+'</strong>':'')
      +(totalDias>0?' Dias adicionales: <strong>'+totalDias+' dias</strong>':'');
  } else if(res) res.innerHTML='';
}



function saveProj(orig,isNew){
  try{
  const nombre=document.getElementById('mNom')?.value?.trim()||'';
  if(!nombre){toast('El nombre es obligatorio','error');return;}
  const prev={fase:orig.fase,avance:orig.avance,tecnico:orig.tecnico,adjudicado:orig.adjudicado};
  orig.nombre=nombre;orig.sede=document.getElementById('mSede')?.value||orig.sede||'Sede Central';
  orig.tipo=document.getElementById('mTipo')?.value||orig.tipo||'';orig.objeto=document.getElementById('mObj')?.value?.trim()||'';
  orig.fase=document.getElementById('mFaseBloque')?.value||'pre';
  orig.fasePrec=document.getElementById('mFasePrec')?.value||'necesidad';
  orig.faseCont=document.getElementById('mFaseCont')?.value||'acta_inicio';
  orig.fasePos=document.getElementById('mFasePos')?.value||'acta_final';
  orig.avance=parseInt(document.getElementById('mAvance')?.value)||0;
  orig.adjudicado=document.getElementById('mAdj')?.checked||false;orig.secop=document.getElementById('mSecop')?.value?.trim()||'';
  orig.tecnico=document.getElementById('mTec')?.value||'';orig.juridico=document.getElementById('mJur')?.value||'';
  orig.financiero=document.getElementById('mFin')?.value||orig.financiero||'';orig.supervisor=document.getElementById('mSup')?.value||'';
  orig.equipoActual=document.getElementById('mEqActual')?.value||'tecnico';
  orig.contratista=document.getElementById('mCont')?.value?.trim()||'';
  orig.avanceContractual=parseInt(document.getElementById('mAvC')?.value)||0;
  // Save adiciones
  const adicionesNew=[];
  for(let i=0;i<20;i++){
    const tipo=document.getElementById('adTipo'+i)?.value||'';
    if(!tipo)continue;
    const valor=parseFloat(document.getElementById('adValor'+i)?.value)||0;
    const dias=parseInt(document.getElementById('adDias'+i)?.value)||0;
    const desc=document.getElementById('adDesc'+i)?.value?.trim()||'';
    adicionesNew.push({tipo,valor,dias,desc});
  }
  orig.adiciones=adicionesNew;
  orig.adicion=adicionesNew.length>0;
  orig.valorAdicion=adicionesNew.reduce((s,a)=>s+(a.valor||0),0);
  orig.descAdicion=adicionesNew.map(a=>a.tipo+(a.desc?' - '+a.desc:'')).join('; ');
  orig.avancePoscontractual=parseInt(document.getElementById('mAvP')?.value)||0;
  orig.avanceObra=parseInt(document.getElementById('mAvObra')?.value)||0;
  // Save pagos
  const pagosNew=[];
  let totalPagado=0;
  for(let i=0;i<10;i++){
    const fecha=document.getElementById('pgFecha'+i)?.value||'';
    const desc=document.getElementById('pgDesc'+i)?.value?.trim()||'';
    const valor=parseFloat(document.getElementById('pgValor'+i)?.value)||0;
    const avanceObra=parseFloat(document.getElementById('pgObra'+i)?.value)||0;
    pagosNew.push({fecha,desc,valor,avanceObra});
    totalPagado+=valor;
  }
  orig.pagos=pagosNew;
  orig.pagado=totalPagado;
  orig.actasPago=pagosNew.filter(p=>p.valor>0).length;
  orig.retencion=parseFloat(document.getElementById('mRetencion')?.value)||0;
  orig.fechaActaFinal=document.getElementById('mFActa')?.value||'';
  orig.cdp=parseFloat(document.getElementById('mCdp')?.value)||0;orig.valorContrato=parseFloat(document.getElementById('mVal')?.value)||0;
  orig.fechaInicio=document.getElementById('mFini')?.value||'';orig.fechaFin=document.getElementById('mFfin')?.value||'';
  orig.rutaDocumentos=document.getElementById('mRuta')?.value?.trim()||'';
  orig.observaciones=document.getElementById('mObs')?.value?.trim()||'';
  if(!orig.historial)orig.historial=[];
  const cambios=[];
  if(prev.fase!==orig.fase)cambios.push('Fase: '+FASES[prev.fase]?.label+' → '+FASES[orig.fase]?.label);
  if(prev.avance!==orig.avance)cambios.push('Avance: '+prev.avance+'% → '+orig.avance+'%');
  if(prev.tecnico!==orig.tecnico&&orig.tecnico)cambios.push('Técnico: '+orig.tecnico);
  if(!prev.adjudicado&&orig.adjudicado)cambios.push('Marcado como adjudicado ✅');
  const accion=isNew?'Creó el proyecto':(cambios.length?cambios.join(' · '):'Actualizó proyecto');
  orig.historial.unshift({fecha:nowISO(),persona:SES?.usuario,nombre:SES?.nombre,rol:SES?.rol,accion});
  if(orig.historial.length>50)orig.historial.length=50;
  if(isNew)PROJ.push(orig);
  logAudit(isNew?'Creo proyecto: '+nombre:accion,nombre);
  save();
  closeModal();
  try{if(typeof renderProyectos==='function')renderProyectos();}catch(e){}
  toast(isNew?'✅ Proyecto creado':'✅ Guardado correctamente','success');
  }catch(err){
    console.error('saveProj error:',err);
    toast('❌ Error al guardar: '+err.message,'error');
  }
}

function delProj(id){
  const p=PROJ.find(x=>x.id===id);
  if(!p)return;
  if(!confirm('Eliminar: '+p.nombre))return;
  PROJ=PROJ.filter(x=>x.id!==id);
  logAudit('Elimino proyecto: '+p.nombre,'CDP: '+fmtM(p.cdp));
  save();closeModal();setPage(PAGE);toast('Proyecto eliminado','warn');
}

        <div class="field"><label>Nombre completo</label><input id="uNom" value="${esc(f.nombre)}"></div>
        <div class="field"><label>Usuario (primernombre.apellido)</label><input id="uUser" value="${esc(f.usuario)}" ${!isNew?'disabled':''}></div>
      </div>
      <div class="form-2">
        <div class="field"><label>Cédula</label><input id="uCed" value="${esc(f.cedula)}"></div>
        <div class="field"><label>Rol</label><select id="uRol">
          ${Object.entries(ROL_LABEL).map(([k,v])=>`<option value="${k}" ${f.rol===k?'selected':''}>${v}</option>`).join('')}
        </select></div>
      </div>
      <div class="toggle-row">
        <input type="checkbox" id="uActivo" ${f.activo!==false?'checked':''}>
        <label for="uActivo">Usuario activo (puede ingresar al sistema)</label>
      </div>
      <div class="toggle-row" style="margin-top:8px;">
        <input type="checkbox" id="uEsSup" ${f.esSupervisor?'checked':''}>
        <label for="uEsSup"><strong>🏗️ También es Supervisor de obra</strong> — aparece en el campo Supervisor de los proyectos</label>
      </div>
      <div class="section-sep">Permisos de módulos</div>
      <div class="perms-grid">
        <div class="perm-item"><input type="checkbox" id="pProy" ${f.permisos.proyectos?'checked':''}><div><div class="perm-label">🏗️ Ver proyectos</div><div class="perm-desc">Puede ver el listado de proyectos</div></div></div>
        <div class="perm-item"><input type="checkbox" id="pProyEdit" ${f.permisos.proyectosEditar?'checked':''}><div><div class="perm-label">✏️ Editar proyectos</div><div class="perm-desc">Puede modificar datos de proyectos</div></div></div>
        <div class="perm-item"><input type="checkbox" id="pProyNuevo" ${f.permisos.proyectosNuevo?'checked':''}><div><div class="perm-label">➕ Crear proyectos</div><div class="perm-desc">Puede agregar nuevos proyectos</div></div></div>
        <div class="perm-item"><input type="checkbox" id="pUsers" ${f.permisos.usuarios?'checked':''}><div><div class="perm-label">👥 Gestionar usuarios</div><div class="perm-desc">Ver y editar usuarios (solo admin)</div></div></div>
        <div class="perm-item"><input type="checkbox" id="pAudit" ${f.permisos.auditoria?'checked':''}><div><div class="perm-label">🔍 Auditoría</div><div class="perm-desc">Ver registros del sistema</div></div></div>
        <div class="perm-item"><input type="checkbox" id="pConf" ${f.permisos.config?'checked':''}><div><div class="perm-label">⚙️ Configuración</div><div class="perm-desc">Equipos y ajustes del sistema</div></div></div>
        <div class="perm-item"><input type="checkbox" id="pExport" ${f.permisos.exportar?'checked':''}><div><div class="perm-label">📤 Exportar informes</div><div class="perm-desc">Generar PDFs y reportes</div></div></div>
        <div class="perm-item"><input type="checkbox" id="pDrive" ${f.permisos.drive?'checked':''}><div><div class="perm-label">☁️ Sincronizar Drive</div><div class="perm-desc">Guardar y cargar datos en Drive</div></div></div>
      </div>
      ${isNew?`<div class="section-sep">Contraseña inicial</div>
      <div style="background:var(--surface);border-radius:8px;padding:12px;font-size:12.5px;color:var(--muted);">La contraseña inicial será la cédula del usuario. El usuario puede cambiarla después desde su perfil.</div>`:''}
    </div>
    <div class="modal-foot">
      <div></div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" id="uSave">Guardar</button>
      </div>
    </div>`;
  openModal();
  document.getElementById('uSave').addEventListener('click',async()=>{
    const nombre=document.getElementById('uNom').value.trim();
    const usuario=isNew?document.getElementById('uUser').value.trim().toLowerCase():f.usuario;
    const cedula=document.getElementById('uCed').value.trim();
    if(!nombre||!usuario||!cedula){toast('Completa nombre, usuario y cédula','error');return;}
    if(isNew&&USERS.find(u=>u.usuario===usuario)){toast('Ese usuario ya existe','error');return;}
    f.nombre=nombre;f.usuario=usuario;f.cedula=cedula;
    f.rol=document.getElementById('uRol').value;
    f.activo=document.getElementById('uActivo').checked;
    f.esSupervisor=document.getElementById('uEsSup')?.checked||false;
    // Sync supervisor list
    const _sl=getTeamList('supervisores');
    if(f.esSupervisor&&!_sl.includes(f.nombre)){_sl.push(f.nombre);saveTeamList('supervisores',_sl);}
    else if(!f.esSupervisor&&_sl.includes(f.nombre)){saveTeamList('supervisores',_sl.filter(n=>n!==f.nombre));}
    f.permisos={
      proyectos:document.getElementById('pProy')?.checked||false,
      proyectosEditar:document.getElementById('pProyEdit')?.checked||false,
      proyectosNuevo:document.getElementById('pProyNuevo')?.checked||false,
      usuarios:document.getElementById('pUsers')?.checked||false,
      auditoria:document.getElementById('pAudit')?.checked||false,
      config:document.getElementById('pConf')?.checked||false,
      exportar:document.getElementById('pExport')?.checked||false,
      drive:document.getElementById('pDrive')?.checked||false
    };
    if(isNew){
      USERS.push(f);
      pwdHash[f.id]=await hashPwd(cedula);
      localStorage.setItem(PK,JSON.stringify(pwdHash));
    }
    logAudit(isNew?'Creó usuario: '+nombre:'Editó usuario: '+nombre,'');
    save();closeModal();renderUsuarios();toast(isNew?'Usuario creado ✅':'Usuario actualizado ✅','success');
  });
}

function toggleUser(id){
  const u=USERS.find(x=>x.id===id);if(!u)return;
  u.activo=u.activo===false;
  logAudit((u.activo?'Activó':'Desactivó')+' usuario: '+u.nombre,'');
  save();renderUsuarios();toast(u.activo?'Usuario activado ✅':'Usuario desactivado 🔒',u.activo?'success':'warn');
}

async function resetUserPwd(id){
  const u=USERS.find(x=>x.id===id);if(!u)return;
  if(!confirm('¿Restablecer contraseña de '+u.nombre+' a su cédula ('+u.cedula+')?'))return;
  pwdHash[u.id]=await hashPwd(u.cedula);
  localStorage.setItem(PK,JSON.stringify(pwdHash));
  logAudit('Restableció contraseña de: '+u.nombre,'');
  save();toast('Contraseña restablecida a cédula ✅','success');
}

function deleteUser(id){
  const u=USERS.find(x=>x.id===id);if(!u)return;
  if(!confirm('¿Eliminar a '+u.nombre+'? Esta acción no se puede deshacer.'))return;
  USERS=USERS.filter(x=>x.id!==id);
  delete pwdHash[id];localStorage.setItem(PK,JSON.stringify(pwdHash));
  logAudit('Eliminó usuario: '+u.nombre,'');
  save();renderUsuarios();toast('Usuario eliminado','warn');
}

// ══ AUDITORÍA ══

  const filtroUser=window._aUser||'';

  mc.innerHTML=`

    <div>
      <div style="font-size:13px;color:var(--muted);">${AUDIT.length} registros totales · Solo visible para el administrador</div>
    </div>
    <span class="sem sem-rojo" style="font-size:12px;">🔒 Acceso exclusivo: Duberly Carvajal</span>
  </div>
  <div class="toolbar">
    <select id="aTipo" class="btn btn-sm" style="font-size:12.5px;">
      <option value="">Todos los tipos</option>${tipo_opts}
    </select>
    <select id="aUser" class="btn btn-sm" style="font-size:12.5px;">
      <option value="">Todos los usuarios</option>
      ${[...new Set(AUDIT.map(a=>a.usuario))].map(u=>`<option value="${u}" ${filtroUser===u?'selected':''}>${u}</option>`).join('')}
    </select>
    <span style="margin-left:auto;font-size:12.5px;color:var(--muted);">${logs.length} registros</span>
  </div>
  <div class="card">
    <div class="scroll-y">
      ${logs.slice(0,100).map(a=>`
      <div class="audit-item">
        <div class="audit-avatar" style="background:${tipoColor[a.tipo]||'#64748b'}22;color:${tipoColor[a.tipo]||'#64748b'};">${tipos[a.tipo]||'📋'}</div>
        <div class="audit-content">
          <div class="audit-header">
            <span class="audit-who">${esc(a.nombre||a.usuario)}</span>
            <span class="audit-ts">${fmtTS(a.fecha)}</span>
          </div>
          <div class="audit-action">${esc(a.accion)}${a.detalle?' — '+esc(a.detalle):''}</div>
          <div class="audit-meta">
            <span class="audit-tag">🌐 ${esc(a.ip||'N/D')}</span>
            <span class="audit-tag">🖥️ ${esc(a.browser)} / ${esc(a.os)}</span>
            <span class="audit-tag">📱 ${esc(a.device)}</span>
            <span class="audit-tag">📁 ${esc(a.modulo||'—')}</span>
          </div>
        </div>
      </div>`).join('')||'<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-sub">Sin registros con ese filtro.</div></div>'}
    </div>
  </div>`;

  document.getElementById('aTipo')?.addEventListener('change',e=>{window._aTipo=e.target.value;renderAuditoria();});
  document.getElementById('aUser')?.addEventListener('change',e=>{window._aUser=e.target.value;renderAuditoria();});

// ══ DRIVE MODAL ══
function openDriveModal(){
  document.getElementById('modal').innerHTML=`
    <div class="modal-head"><h3>☁️ Conectar Google Drive</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      ${SCRIPT_URL?`<div style="background:#d1fae5;color:#065f46;padding:12px 14px;border-radius:8px;margin-bottom:14px;font-size:12.5px;">✅ Conectado<br><span style="font-size:11px;font-family:var(--mono);word-break:break-all;">${esc(SCRIPT_URL)}</span></div>`:'<div style="background:#fef3c7;color:#92400e;padding:12px 14px;border-radius:8px;margin-bottom:14px;font-size:12.5px;">🟡 Sin conexión — los datos se guardan localmente.</div>'}
      <div class="field"><label>URL del Apps Script</label><input id="drUrl" value="${esc(SCRIPT_URL)}" placeholder="https://script.google.com/macros/s/..."></div>
      <p style="font-size:12px;color:var(--muted);">Usa la misma URL configurada en el Portal GIM.</p>
    </div>
    <div class="modal-foot">
      <div>${SCRIPT_URL?'<button class="btn btn-danger btn-sm" id="drDisc">Desconectar</button>':''}</div>
      <div style="display:flex;gap:8px;"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="drConn">Conectar y sincronizar</button></div>
    </div>`;
  openModal();
  document.getElementById('drConn').addEventListener('click',async()=>{
    const url=document.getElementById('drUrl').value.trim();
    if(!url){toast('Pega la URL','error');return;}
    toast('Conectando...');
    try{
      const ctrl=new AbortController();setTimeout(()=>ctrl.abort(),6000);
      const res=await fetch(url+'?tool=sig-infra',{redirect:'follow',signal:ctrl.signal});
      if(!res.ok)throw new Error('HTTP '+res.status);
      const d=await res.json();
      SCRIPT_URL=url;localStorage.setItem(SK,url);
      if(d?.projects?.length){PROJ=d.projects;save();}
      if(d?.users?.length)USERS=d.users;
      if(d?.audit?.length)AUDIT=d.audit;
      closeModal();updateDriveUI();setPage(PAGE);toast('✅ Drive conectado y sincronizado','success');
    }catch(e){toast('❌ '+(e.name==='AbortError'?'Tiempo agotado':e.message),'error');}
  });
  document.getElementById('drDisc')?.addEventListener('click',()=>{SCRIPT_URL='';localStorage.removeItem(SK);closeModal();updateDriveUI();toast('Drive desconectado');});
}

// ══ PASSWORD MODAL ══
async function openPwdModal(){
  document.getElementById('modal').innerHTML=`
    <div class="modal-head"><h3>🔑 Cambiar mi contraseña</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div style="background:var(--surface);border-radius:8px;padding:12px;font-size:12.5px;color:var(--muted);margin-bottom:16px;">Solo tú puedes cambiar tu contraseña. Ningún otro usuario puede hacerlo.</div>
      <div class="field"><label>Contraseña actual</label><input type="password" id="pA" placeholder="Tu contraseña actual"></div>
      <div class="field"><label>Nueva contraseña (mín. 8 caracteres)</label><input type="password" id="pN" placeholder="Nueva contraseña segura"></div>
      <div class="field"><label>Confirmar nueva contraseña</label><input type="password" id="pC" placeholder="Repite la nueva contraseña"></div>
    </div>
    <div class="modal-foot"><div></div><div style="display:flex;gap:8px;"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="pSv">Actualizar contraseña</button></div></div>`;
  openModal();
  document.getElementById('pSv').addEventListener('click',async()=>{
    const actual=document.getElementById('pA').value;
    const nueva=document.getElementById('pN').value;
    const conf=document.getElementById('pC').value;
    const hashActual=await hashPwd(actual);
    if(hashActual!==pwdHash[SES.id]){toast('Contraseña actual incorrecta','error');return;}
    if(nueva.length<8){toast('La contraseña debe tener al menos 8 caracteres','error');return;}
    if(nueva!==conf){toast('Las contraseñas no coinciden','error');return;}
    pwdHash[SES.id]=await hashPwd(nueva);
    localStorage.setItem(PK,JSON.stringify(pwdHash));
    logAudit('Cambió su contraseña','');
    closeModal();toast('✅ Contraseña actualizada correctamente','success');
  });
}

function refreshData(){
  if(SCRIPT_URL){
    remoteLoad().then(d=>{
      if(d?.projects?.length){PROJ=d.projects;localStorage.setItem(DK,JSON.stringify(PROJ));}
      setPage(PAGE);toast('🔄 Datos actualizados','success');
    }).catch(()=>toast('Sin conexión a Drive','warn'));
  } else {toast('Conecta Drive para sincronizar','warn');}
}


function recalcPos(){
  // Sum pagos values and update resumen
  let totalPagado=0, lastObra=0;
  for(let i=0;i<10;i++){
    const v=parseFloat(document.getElementById('pgValor'+i)?.value)||0;
    const o=parseFloat(document.getElementById('pgObra'+i)?.value)||0;
    totalPagado+=v;
    if(o>0) lastObra=o;
  }
  const valContrato=parseFloat(document.getElementById('mVal')?.value)||0;
  const pct=valContrato>0?Math.min(100,Math.round(totalPagado/valContrato*100)):0;
  const res=document.getElementById('posResumen');
  if(res){
    res.innerHTML='<div style="font-weight:700;color:#059669;margin-bottom:4px;">Resumen automatico</div>'
      +'<div>Total pagado: <strong>$'+totalPagado.toLocaleString("es-CO")+'</strong></div>'
      +'<div>'+pct+'% del contrato</div>'
      +'<div>Ultimo avance obra: <strong>'+lastObra+'%</strong></div>';
  }
  updateStages();
}

function updateStages(){
  const avPre=parseInt(document.getElementById('mAvance')?.value)||0;
  const avCont=parseInt(document.getElementById('mAvC')?.value)||0;
  const avPos=parseInt(document.getElementById('mAvP')?.value)||0;
  const map={pre:avPre,cont:avCont,pos:avPos};
  Object.entries(map).forEach(([k,v])=>{
    const el=document.getElementById('blkVal_'+k);
    if(el)el.textContent=v+'%';
  });
}

function openModal(){document.getElementById('overlay').classList.add('show');}
function closeModal(){document.getElementById('overlay').classList.remove('show');}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal();});

// ══ SUPERVISORES (editables por admin) ══
const SUP_KEY='sig_supervisores';
const SUP_DEFAULT=['Walter David Isaza Avilés','Iván David Céspedes Roa'];
function getSupervisores(){
  // First check teams (editable list)
  try{const t=getTeams();if(t&&t.supervisores&&t.supervisores.length>0)return t.supervisores;}catch(e){}
  // Then check SUP_KEY legacy
  try{const d=localStorage.getItem(SUP_KEY);if(d)return JSON.parse(d);}catch(e){}
  return SUP_DEFAULT;
}
function saveSupervisores(list){localStorage.setItem(SUP_KEY,JSON.stringify(list));}

// ══ BOOT ══
(async function boot(){
  loadTheme();
  loadLocal();
  await initPwdHashes();
  document.getElementById('loginLogo').src=_ESAP;
  SCRIPT_URL=localStorage.getItem(SK)||'';
  // Auto-login from session
  const s=sessionStorage.getItem(SESSION_KEY);
  if(s){
    try{
      const x=JSON.parse(s);
      const u=USERS.find(d=>d.id===x.id&&d.usuario===x.u&&d.activo!==false);
      if(u){SES=u;sessionStart=x.t;startApp();return;}
    }catch(e){}
  }
  // Show login
})();

// ══ GESTIÓN DE EQUIPOS Y SUPERVISORES ══
// Keys for custom team overrides

function renderEquipos(){
  var mc=document.getElementById('page-equipos');
  if(!mc)return;
  var teams=ensureTeams();
  var grupos=[
    {key:'tecnico',   label:'Equipo Tecnico',    color:'#0284c7'},
    {key:'juridico',  label:'Equipo Juridico',    color:'#7c3aed'},
    {key:'financiero',label:'Equipo Financiero',  color:'#059669'},
    {key:'supervisores',label:'Supervisores',     color:'#0f1f3d'}
  ];
  var rows='';
  grupos.forEach(function(g){
    var list=teams[g.key]||[];
    var items='';
    for(var i=0;i<list.length;i++){
      var n=list[i]||'';
      var ini=n.length>0?n[0].toUpperCase():'?';
      items+='<div style="display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);">';
      items+='<div style="width:32px;height:32px;border-radius:8px;background:'+g.color+'22;color:'+g.color+';display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;">'+ini+'</div>';
      items+='<span style="flex:1;font-size:13px;font-weight:600;">'+esc(n)+'</span>';
      items+='<button type="button" class="btn btn-sm eqr-btn" data-k="'+g.key+'" data-i="'+i+'" style="color:#dc2626;border-color:#dc2626;padding:3px 8px;">X</button>';
      items+='</div>';
    }
    rows+='<div class="card" style="border-top:3px solid '+g.color+';">';
    rows+='<div class="card-head"><h3>'+g.label+' ('+list.length+')</h3></div>';
    rows+='<div id="teamList_'+g.key+'">'+items+'</div>';
    rows+='<div style="padding:10px 12px;">';
    rows+='<div style="display:flex;gap:6px;">';
    rows+='<input id="newName_'+g.key+'" placeholder="Nombre completo..." class="btn" style="flex:1;text-align:left;font-size:12px;padding:7px 10px;border:1px solid var(--border);background:var(--card);border-radius:8px;color:var(--ink);">';
    rows+='<button type="button" class="btn btn-primary btn-sm eqa-btn" data-k="'+g.key+'">+ Agregar</button>';
    rows+='</div>';
    if(g.key!=='supervisores'){
      rows+='<button type="button" class="btn btn-sm eqs-btn" data-k="'+g.key+'" style="margin-top:6px;color:var(--muted);font-size:11px;">Sincronizar directorio</button>';
    }
    rows+='</div></div>';
  });
  mc.innerHTML='<div style="max-width:760px;">'
    +'<div style="font-size:20px;font-weight:900;color:var(--ink);margin-bottom:16px;">Gestion de equipos</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">'+rows+'</div>'
  +'</div>';
  mc.addEventListener('click',function(ev){
    var rb=ev.target.closest('.eqr-btn');if(rb){quitarDeEquipo(rb.dataset.k,parseInt(rb.dataset.i));return;}
    var ab=ev.target.closest('.eqa-btn');if(ab){agregarAEquipo(ab.dataset.k);return;}
    var sb=ev.target.closest('.eqs-btn');if(sb){sincronizarEquipo(sb.dataset.k);}
  });
}

function agregarAEquipo(key){
  const input=document.getElementById('newName_'+key);
  const nombre=input?.value?.trim();
  if(!nombre){toast('Escribe un nombre','error');return;}
  const list=getTeamList(key);
  if(list.includes(nombre)){toast('Ya está en la lista','warn');return;}
  list.push(nombre);
  saveTeamList(key,list);
  input.value='';
  logAudit('Agregó a '+key+': '+nombre,'');
  renderEquipos();
  toast('✅ '+nombre+' agregado','success');
}

function quitarDeEquipo(key,idx){
  const list=getTeamList(key);
  const nombre=list[idx];
  if(!confirm('¿Quitar a '+nombre+' de la lista?'))return;
  list.splice(idx,1);
  saveTeamList(key,list);
  logAudit('Quitó de '+key+': '+nombre,'');
  renderEquipos();
  toast('Quitado: '+nombre);
}

function sincronizarEquipo(rol){
  const list=USERS.filter(u=>u.rol===rol&&u.activo).map(u=>u.nombre);
  saveTeamList(rol,list);
  renderEquipos();
  toast('Lista sincronizada con el directorio','success');
}
